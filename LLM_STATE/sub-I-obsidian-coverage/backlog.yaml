tasks:
- id: symlink-verification-spike
  title: Symlink verification spike
  category: spike
  status: not_started
  dependencies: []
  description: |
    Guivision + OCR evidence that Obsidian follows
    symlinks on macOS. Verify: file tree shows symlinked project
    directories, Dataview queries in plan-inventory view return results
    from symlinked plans, search finds content within symlinked knowledge
    directories. Evidence artifacts at
    `{{PROJECT}}/tests/fixtures/obsidian-symlink-spike/results/macos/`.
    Follow the testanyware + OCR evidence pattern established in memory.
- id: author-obsidian-configuration-files
  title: Author `.obsidian/` configuration files
  category: authoring
  status: not_started
  dependencies:
  - none-can-parallel-with-task-1
  description: |
    Create the `.obsidian/` configuration files at
    `{{PROJECT}}/priv/obsidian/.obsidian/`:
    - `app.json` — settings per design doc §3.3
    - `core-plugins.json` — enables/disables per §3.2
    - `community-plugins.json` — `["dataview", "templater-obsidian", "homepage"]`
    - `plugins/dataview/data.json` — per §6.1
    - `plugins/templater-obsidian/data.json` — per §6.1
    - `plugins/homepage/data.json` — per §6.1

    These are the embedded resources that `ravel init` copies into new
    vaults.
- id: author-templater-templates
  title: Author Templater templates
  category: authoring
  status: not_started
  dependencies:
  - none-can-parallel-with-tasks-1-2
  description: |
    Create two Templater templates at
    `{{PROJECT}}/priv/obsidian/templates/`:
    - `knowledge-entry.md` — per design doc §4.1
    - `expert-declaration.md` — per design doc §4.2

    Verify Templater prompt syntax is correct by testing in a scratch
    Obsidian vault.
- id: author-dataview-view-files
  title: Author Dataview view files
  category: authoring
  status: not_started
  dependencies:
  - none-can-parallel-with-tasks-1-3
  description: |
    Create four starter Dataview query files at
    `{{PROJECT}}/priv/obsidian/views/`:
    - `plan-inventory.md` — per design doc §5.1
    - `expert-inventory.md` — per design doc §5.2
    - `recent-knowledge.md` — per design doc §5.3
    - `knowledge-by-tag.md` — per design doc §5.4

    Verify Dataview query syntax is correct by testing against a vault
    with sample plan-state.md, expert declarations, and knowledge entries.
- id: sub-a-amendment-init-scaffolding
  title: 'Sub-A amendment: init scaffolding'
  category: amendment
  status: not_started
  dependencies:
  - tasks-2-4-complete-files-must-exist-to-reference
  description: |
    Amend sub-A's design doc and backlog to extend the
    `init` command scaffolding:
    - Copy `priv/obsidian/templates/` to `<vault>/templates/`
    - Copy `priv/obsidian/views/` to `<vault>/views/`
    - Add `templates/` and `views/` rows to A§A5 git-tracking policy
      table (both tracked, rationale: shared config)

    This is a lightweight amendment — mechanically identical to the
    existing `.obsidian/` copy in A's init flow.
- id: sub-e-amendment-schema-version-confirmation
  title: 'Sub-E amendment: schema-version confirmation'
  category: amendment
  status: not_started
  dependencies: []
  description: |
    Confirm that sub-E's ingestion pipeline writes
    `schema-version` to knowledge entry frontmatter. Sub-I's
    recent-knowledge Dataview view filters on this field. If not already
    explicit in E's design doc, add it as a requirement in E's amendment
    task.
- id: end-to-end-acceptance-test
  title: End-to-end acceptance test
  category: acceptance
  status: not_started
  dependencies:
  - tasks-1-6-complete
  description: |
    Full acceptance test via testanyware + OCR:
    1. `ravel init` creates a vault with all template files
    2. Open vault in Obsidian — verify trust-plugins dialog
    3. Verify Homepage opens plan-catalog.md
    4. Verify file tree shows expected structure (templates/, views/,
       experts/, knowledge/, etc.)
    5. Adopt a project with existing plans
    6. Verify plan-inventory Dataview query returns results
    7. Verify expert-inventory query shows default experts
    8. Create an expert via Templater template — verify correct
       frontmatter
    9. Create a knowledge entry via Templater — verify correct frontmatter

    Evidence artifacts at
    `{{PROJECT}}/tests/fixtures/obsidian-e2e/results/macos/`.
- id: absorb-sub-r-document-ontology-views-in-data-surface-inventory
  title: 'Absorb Sub-R: document ontology views in data-surface inventory'
  category: amendment
  status: not_started
  dependencies:
  - none-design-doc-amendment-no-code-dependency
  description: |
    Per Sub-R design doc §7.3. Add `ontology/views/`
    surfaces to Sub-I's data-surface inventory. The design doc amendment
    is being done by a Sub-R adoption agent. This backlog task covers
    any remaining implementation-time work:
    - Add an `ontology-views.md` Dataview query file to
      `priv/obsidian/views/` if useful (e.g., a view that aggregates
      all auto-generated ontology views)
    - Verify `.dl` files render correctly as plain text in Obsidian
    - Update Task 7 acceptance test to verify ontology views render
