- id: task-16-mix-ravel-metrics-mix-task-cli
  title: Task 16 — `mix ravel.metrics` Mix task `[cli]`
  category: cli
  status: not_started
  dependencies:
  - task-9
  description: |
    Depends on Task 9 (snapshot format).

    Escript-style Mix task at `lib/mix/tasks/ravel.metrics.ex` using
    `use Mix.Task` + `@shortdoc`. Parses arguments via `OptionParser`
    (`--qualified-id`, `--since <ISO8601>`, `--session`, `--json`).

    Reads JSONL events from `<vault>/runtime/events/<qualified-id>/`
