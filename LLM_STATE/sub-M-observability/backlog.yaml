  category: types
  status: not_started
  dependencies:
  - task-0
  - sub-n-task-15-early-deliverable-pr
  description: |
    Gated on sub-N Task 15 early-deliverable PR (delivers concrete
    struct definitions) and Task 0 complete.

    Sub-N (domain experts, brainstormed Session 16, 2026-04-15) is a
    new typed-event producer that emits six structs in the
    `Ravel.Event.Expert.*` group. Sub-M's sealed struct set (§4.1) and
    metric catalogue (§6) must absorb these before sub-N's
    implementation tasks begin.

    **Struct additions to §4.1** — add the following six structs to the
    sealed set under a new `Expert` producer group. Each carries
    `@enforce_keys` + `@derive Jason.Encoder`:

    1. `%Ravel.Event.Expert.ConsultationStarted{}` — query arrives at
       an ExpertActor
    2. `%Ravel.Event.Expert.ConsultationCompleted{}` — verdict returned
       (absorb/reject/cross-link)
    3. `%Ravel.Event.Expert.ConflictDetected{}` — contentful
       disagreement between two experts on the same candidate
    4. `%Ravel.Event.Expert.DialogueStarted{}` — multi-turn dialogue
       begins
    5. `%Ravel.Event.Expert.DialogueTurnCompleted{}` — one turn
       completes
    6. `%Ravel.Event.Expert.DialogueExpired{}` — idle TTL (30 min
       default) reached

    **Metric additions to §6** — add corresponding
    `Telemetry.Metrics.*` definitions to the catalogue:

    - `counter("ravel.expert.consultation.started")` — per-domain,
      per-session
    - `counter("ravel.expert.consultation.completed")` with `keep:`
      filter for verdict field (absorb/reject/cross-link)
    - `distribution("ravel.expert.consultation.latency_ms")` —
      ConsultationStarted → ConsultationCompleted
    - `counter("ravel.expert.conflict.detected")` — rate of
      inter-expert disagreements
    - `counter("ravel.expert.dialogue.started")`
    - `counter("ravel.expert.dialogue.turn.completed")`
    - `distribution("ravel.expert.dialogue.turn_count")` — turns per
      dialogue (recorded at DialogueExpired or final
      ConsultationCompleted)
    - `counter("ravel.expert.dialogue.expired")` — idle TTL expiry
      rate

    **Design doc edits required:**

    1. Add sub-N to the producer table in §4.1 alongside B/C/F/E/A.
    2. Add the eight metric definitions above to §6 with a Decision
       Trail entry recording the source (sub-N brainstorm, Session
       16).
    3. Update the catalogue-integrity test (Task 4) to count the new
       definitions.

    **Discipline.** Adding these variants to the sealed set requires a
    Decision Trail entry per §4.1's "sealed for v1" rule. The entry
    should cite sub-N's §9.5 as the producer-side commitment and note
    that this is the only expansion of the sealed set between v1 and
    v1.5.
