- id: task-17-mix-ravel-diagnose-mix-task-cli
  title: Task 17 — `mix ravel.diagnose` Mix task `[cli]`
  category: cli
  status: not_started
  dependencies:
  - task-8
  - task-2
  description: |
    Depends on Task 8 (JSONL format) and Task 2
    (`Ravel.Event.reconstruct/1`).

    Escript-style Mix task at `lib/mix/tasks/ravel.diagnose.ex`.
    Arguments: `--session <session-id>`, `--last <n>` (default 50).

    Reads `<vault>/runtime/events/<qualified-id>/<session-id>.jsonl`
    and prints the last N events in chronological order. Uses
    `Ravel.Event.reconstruct/1` to rebuild event structs from the
    decoded JSON. Mirrors the in-memory `RingBuffer.dump_session/2` API
    but works against persisted JSONL after the session has ended.
    Useful when the live `event-tail.json` dump is missing or
    insufficient.

    Warn if any drops occurred in the session snapshot (per Risk 2
    mitigation in §17). Integration test against a fixture session
    JSONL.
