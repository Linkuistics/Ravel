- id: task-22-re-entrancy-stress-test-testing
  title: Task 22 — Re-entrancy stress test `[testing]`
  category: testing
  status: not_started
  dependencies:
  - task-12
  description: |
    Risk 1 mitigation. ExUnit integration test with `@moduletag :live`
    that emits 1M `:telemetry` events through the full Handler →
    subscriber stack across 4 concurrent producer processes (250k
    events each). Attaches a **witness handler** that counts recursive
    dispatches via a process-dictionary sentinel.

    Asserts:

    - Zero recursive dispatches (enforces §5.3 re-entrancy discipline).
    - No `Handler` detach events (`:telemetry` did not detach the
      handler).
    - No `JsonlWriter` restart events (mailbox stayed bounded).
    - All events arrived at every subscriber (RingBuffer count, Metrics
      `snapshot/1` counters, JsonlWriter line count, TuiBridge delivery
      count all equal 1M within drop tolerance).
    - Zero `Logger.error/1` calls from the `Handler` rescue path (CI
      fails loud if the rescue fires during tests per Risk 6).

    Also serves as a smoke test for sustained-load correctness of the
    `[:raw, :delayed_write]` JSONL writer.
