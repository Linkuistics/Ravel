- id: task-6-ravel-observability-handler-try-rescue-wrapper-handler
  title: Task 6 — `Ravel.Observability.Handler` + `try/rescue` wrapper `[handler]`
  category: handler
  status: not_started
  dependencies:
  - task-2
  description: |
    Implement §5.2 of the spec. The handler module attaches via
    `:telemetry.attach_many/4` from `attach/0` (called by the Supervisor
    after the subscribers are up — see Task 12). `handle_event/4`
    receives every `[:ravel | _]`-prefixed event plus known third-party
    prefixes (`[:erlexec]`, `[:telemetry_poller]`).

    Behaviour:

    1. Extract `metadata.event` or call `synthesise_diagnostic/3` for
       third-party events (no `metadata.event` → wrap as
       `%Diagnostic{target: Enum.join(name, "."), fields: metadata,
       ...}`).
    2. Extract `session_id` + `qualified_id` from `metadata` or from
       the event struct.
    3. Dispatch in order: `RingBuffer.record/2` → `Metrics.record/2` →
       `TuiBridge.publish/3` → `JsonlWriter.append/3` (cheap first,
       expensive IO last).
    4. **Load-bearing `try/rescue`:** catch any raise inside the four
       dispatch calls, log via `Logger.error/1` (stdlib `Logger`, NOT
       through `Ravel.Observability.emit/1` — re-entrancy), return
       `:ok`. This prevents `:telemetry` from detaching the handler
       permanently, which would silently blind the daemon.
    5. **Re-entrancy discipline (§5.3):** subscribers must only use
       `GenServer.cast/2`; no code reachable from the handler may call
       `Ravel.Observability.emit/1` or `:telemetry.execute/3`.

    Unit tests cover every struct in the sealed set round-trip,
    third-party event synthesis, `rescue` path (inject a raise inside a
    subscriber stub; assert handler stays attached + `Logger.error/1`
    fires + dispatch returns `:ok`).

    Size estimate: <100 lines (Q6 translation note from spec).
- id: task-7-ravel-observability-ringbuffer-genserver-dynamicsupervisor-subscriber
  title: Task 7 — `Ravel.Observability.RingBuffer` GenServer + DynamicSupervisor `[subscriber]`
  category: subscriber
  status: not_started
  dependencies:
  - task-6
  description: |
    Per-session bounded ring GenServer under `RingBuffer.Sup`
    DynamicSupervisor. Default capacity 1000 events (configurable via
    `config :ravel, :ring_buffer_capacity`). Storage is Erlang `:queue`
    with capped size; when the queue hits capacity, oldest events evict
    on `record/2`.

    Public API:

    - `record(session_id | :process, event)` — async `GenServer.cast`;
      if the per-session GenServer doesn't exist, started under
      `RingBuffer.Sup` via `DynamicSupervisor.start_child/2`.
    - `dump_session(session_id, n)` — sync `GenServer.call` returning
      `[event]` in chronological order.
    - Process-scoped fallback: events without a `session_id` go to a
      singleton "process" ring shared across the daemon.

    Grace window: when a session ends, the per-session RingBuffer stays
    alive for a configurable grace period (default 30s) before
    termination so `dump_session` calls after session-end still succeed.
    Implemented via `Process.send_after/3` + a `:grace_expired`
    handle_info.

    Unit tests: ring eviction at capacity, per-session isolation,
    `dump_session` chronological order, process-scoped fallback, grace
    window (dump succeeds 25s after session end; fails 35s after),
    supervisor restart behaviour.
- id: task-8-ravel-observability-jsonlwriter-genserver-fileio-routing-subscriber
  title: Task 8 — `Ravel.Observability.JsonlWriter` GenServer + FileIO routing `[subscriber]`
  category: subscriber
  status: not_started
  dependencies:
  - task-6
  - sub-d-ravel-fileio-module
  description: |
    Dependency callout for sub-D `Ravel.FileIO` — see memory.md "Sub-D
    coordination design".

    Per-session JSONL writer GenServer under `JsonlWriter.Sup`
    DynamicSupervisor. Output paths follow §7:
    `<vault>/runtime/events/<qualified-id>/<session-id>.jsonl` for
    session-scoped, `.../process.jsonl` for process-scoped.

    Internally, the GenServer holds a `File` handle opened with
    `[:append, :raw, :binary, :delayed_write]`. `append/3` encodes via
    `Jason.encode_to_iodata!/1` + `"\n"` and writes through the open
    handle.

    **Sub-D FileIO constraint:** `JsonlWriter` must NOT call
    `File.write/3` or `File.open/2` directly. All file interactions
    route through `Ravel.FileIO` per sub-D §3.1 (`:exclusive` category;
    daemon-authoritative runtime files; no freshness check).

    **Append-vs-rewrite resolution:** `FileIO.write_safe/3` performs an
    atomic temp-then-rename, which is correct for rewrites but not for
    streaming appends. Resolution: `JsonlWriter` uses two entry points:

    1. Session-start file creation routes through
       `FileIO.create_append_handle(path, :exclusive)` — new sub-D
       helper that coordinates path registration + initial empty-file
       creation without the rewrite semantics.
    2. Subsequent `append/3` writes go directly through the open file
       handle (`:raw, :delayed_write`) — no conflict detection needed
       because `:exclusive` runtime files are daemon-authoritative.
    3. Session-end finalisation optionally rewrites the file through
       `FileIO.write_safe/3` if post-processing is needed (none in v1).

    If `FileIO.create_append_handle/2` is not yet defined by sub-D,
    coordinate with sub-D's backlog to add it; note the decision in
    both plans' memory.md files.

    Set `{:max_messages, 4096}` process flag for bounded mailbox;
    overflow causes abnormal exit → DynamicSupervisor restart with a
    fresh handle → `events.dropped.count` bumped with `target:
    "ravel.jsonl_writer.restart"`.

    Unit tests: round-trip through tmpdir, line-per-event format,
    `Jason.decode!/1` round-trip, truncation safety, supervisor restart
    on mailbox overflow, no direct `File.write/3` call sites (a Credo
    rule or a test that greps `lib/ravel/observability/jsonl_writer.ex`
    for `File.` calls).
- id: task-9-ravel-observability-metrics-supervisor-snapshotreporter-subscriber
  title: Task 9 — `Ravel.Observability.Metrics` supervisor + `SnapshotReporter` `[subscriber]`
  category: subscriber
  status: not_started
  dependencies:
  - task-3
  - task-6
  description: |
    `Metrics` is a Supervisor (not GenServer) hosting two children:

    1. `Telemetry.Metrics.ConsoleReporter` configured with the catalogue
       from Task 3. Filtered via `Logger` level in `config/dev.exs` /
       `config/prod.exs`.
    2. `Ravel.Observability.Metrics.SnapshotReporter` — **new custom
       reporter, ~150 lines.** Subscribes to the same events
       `ConsoleReporter` does via `:telemetry.attach_many/4` in its
       `init/1`. Maintains per-metric state in `:ets` tables:
       - Counters: `:ets.update_counter/3`.
       - Distributions: bucket histograms per the `reporter_options:
         [buckets: ...]` in the metric definitions; maintains `count`,
         `sum`, `min`, `max`, and per-bucket counts.
       - `last_value`: overwrite.

    Public API:

    - `Metrics.snapshot(session_id)` — folds ETS state into a map
      shaped per §7.2 of the spec (counters, distributions with
      p50/p95/p99 computed from bucket histograms, gauges). Called at
      session end by the phase cycle or by `mix ravel.metrics`.
    - `Metrics.record(event, measurements)` — thin wrapper that
      dispatches to the ETS-backed aggregator (called from
      `Handler.handle_event/4`).

    Unit tests: counter increment correctness, distribution recording
    and percentile correctness against synthetic latency fixtures,
    `last_value` overwrite, snapshot format matches §7.2, `keep:` filter
    correctness for variants that branch on struct fields (e.g.
    `phase_lifecycle.started.count` only fires when `kind == :started`).
- id: task-10-ravel-observability-tuibridge-via-pg-process-group-subscriber
  title: Task 10 — `Ravel.Observability.TuiBridge` via `:pg` process group `[subscriber]`
  category: subscriber
  status: not_started
  dependencies:
  - task-6
  description: |
    GenServer owning a `:pg` process group `:ravel_tui` (OTP stdlib; no
    Phoenix.PubSub dep). Each daemon-client connected over the sub-F
    §6/§7 Unix socket has a per-client session process which joins the
    group from its own `init/1` via `:pg.join(:ravel_tui, self())`.
    Leaving happens automatically on process termination (BEAM
    monitors).

    Public API:

    - `publish(event, session_id, qualified_id)` — called from
      `Handler.handle_event/4`. Internally: `:pg.get_members(:pg,
      :ravel_tui)` to find client pids, then `send/2` each with
      `{:ravel_event, event, %{session_id: session_id, qualified_id:
      qualified_id}}`. Per-client backpressure: wrap each `send/2` in a
      `try/catch` over the client's process_info mailbox size; if above
      `tui_client_mailbox_max` (default 256 messages), skip the send
      and bump `events.dropped.count` with `target:
      "ravel.tui_bridge.drop"`.
    - `subscribe()` and `unsubscribe()` are NOT M's responsibility —
      joining/leaving is done by the client-session process which lives
      in sub-F's daemon protocol layer.

    Unit tests: group join/leave via stub client processes,
    bounded-send behaviour (slow consumer's mailbox fills → drops
    increment), drop counter correctness, multi-client fan-out (3+
    clients each receive the event).
