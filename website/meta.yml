name: Ravel
slug: ravel
tagline: A persistent actor daemon for AI-assisted development.
summary: |
  Ravel is a persistent orchestration daemon built on Elixir/BEAM that gives AI
  coding assistants the architectural primitives to accumulate expertise across
  projects. Plans, phases, knowledge, and fresh-context reasoning — unified in a
  single long-lived actor system.

status: progress
github_url: https://github.com/Linkuistics/Ravel
tags: [ai-tools, ai-knowledge]

