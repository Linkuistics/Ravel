[package]
name = "ravel"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Policy-routed session process manager"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
keyed-launch = { path = "../keyed-launch" }
libc = "0.2"
tempfile = "3.10"

[build-dependencies]
sha2 = "0.10"

# Private fixture seam: forwards the runner's off-by-default fault feature.
[features]
native-faults = ["keyed-launch/native-faults"]

[lints]
workspace = true
