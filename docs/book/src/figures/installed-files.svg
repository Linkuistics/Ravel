522.895" font-family="DejaVu Sans, sans-serif">No host Bun, Node.js or source checkout is needed for installed execution.</text><text x="56.313" y="784.698" fill="#172B3A" font-size="14" textLength="523.585" font-family="DejaVu Sans, sans-serif">Release archives additionally carry README.md and LICENSE at their root.</text></g></g></svg>