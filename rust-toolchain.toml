# The release scripts put rustup's shims first on PATH (pin_rust_toolchain in
# scripts/release-common.sh), and the shims read this file. Without it they use
# the rustup default, which may be older than rust-version in Cargo.toml.
# https://rust-lang.github.io/rustup/overrides.html#the-toolchain-file
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
