# Copying isolated worker/front fixtures and starting Rhai must not compete with
# the suite while a protected one-second selection deadline is being measured.
# No retry or deadline widening: reserve this run's slots for each C2/C3 case.
# Verified with nextest 0.9.148's `help repo-config` and:
# https://nexte.st/docs/configuration/reference/#profilename-threads-required
[[profile.default.overrides]]
filter = "test(worker_reap_admission) | test(partial_acquisition_cleanup)"
threads-required = "num-test-threads"


# Each frame-bound test of `rhai_request` encodes an evaluate frame of about
# 38 MB in both processes. Running it beside the wall-clock controls of
# `rhai_limits` can delay a control past its one-second limit, so it takes the
# whole run's slots in the same way.
[[profile.default.overrides]]
filter = "binary(rhai_request) & test(/frame/)"
threads-required = "num-test-threads"
