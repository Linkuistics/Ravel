version: '3'

set: [errexit, nounset, pipefail]

tasks:
  build:
    desc: Build Ravel's local runner
    cmds:
      - cargo build --locked --workspace

  test:
    desc: Run the local runner suite with nextest
    cmds:
      - cargo nextest run --locked --workspace

  check:
    desc: Check formatting, lint all targets and test the local runner
    silent: true
    cmds:
      - bash scripts/check.sh
