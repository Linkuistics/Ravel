version: '3'

set: [errexit, nounset, pipefail]

tasks:
  docs:result-job:
    desc: Serve editable result-job completion and native-entry views on localhost (Mermaid needs network access)
    vars:
      PORT: '{{.PORT | default "8774"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/result-job

  docs:rhai-policy:
    desc: Serve the editable Rhai policy evaluation views of the 2.0.0 design on localhost (Mermaid needs network access)
    vars:
      PORT: '{{.PORT | default "8776"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/rhai-policy

  docs:book:
    desc: Build the book, then serve it on localhost and rebuild on change (needs task setup)
    vars:
      PORT: '{{.PORT | default "8775"}}'
    cmds:
      - bash scripts/book.sh build
      - bash scripts/book.sh serve {{.PORT}}

  docs:book:build:
    desc: Build the book under target/book and fail on any mdBook error or warning (needs task setup)
    cmds:
      - bash scripts/book.sh build

  docs:figures:
    desc: Regenerate every book figure into a scratch directory and fail on any difference from the committed SVG or its layout record (needs task setup)
    cmds:
      - bash scripts/figures.sh check

  docs:figures:update:
    desc: Rewrite the committed book figure SVGs and their .layout.json records from the Typst sources with the pinned renderer (needs task setup)
    cmds:
      - bash scripts/figures.sh update

  docs:figures:test:
    desc: Prove the figure check passes unchanged fixtures and fails on a changed source, SVG, layout record, layout pin, Typst package or tool (needs task setup)
    silent: true
    cmds:
      - bash scripts/figures.test.sh

  docs:examples:
    desc: Build Ravel, run every complete example under docs/book/src through the CLI test seam and compare output exactly (-- PAGE-OR-DIR... checks those instead; needs task setup)
    cmds:
      - task: build
      - bash scripts/examples.sh check {{.CLI_ARGS}}

  docs:examples:test:
    desc: Prove the example check passes the fixture pages and fails a changed output, status, stale build, unlabelled block and more (needs task setup)
    silent: true
    cmds:
      - task: build
      - bash scripts/examples.test.sh

  docs:examples:mutants:
    desc: Remove one safeguard at a time from a copy of the example checker and show a control fail for each (needs task setup)
    silent: true
    cmds:
      - task: build
      - bash scripts/examples.test.sh mutants

  docs:excerpts:
    desc: Check that every source excerpt in docs/book/src is whole lines that still occur in the tracked file it names (needs no build)
    cmds:
      - bash scripts/excerpts.sh check {{.CLI_ARGS}}

  docs:excerpts:test:
    desc: Prove the excerpt check passes good excerpts and fails a changed excerpt or source, a bad path, a bad label or block and more, and that each removed safeguard fails a control
    silent: true
    cmds:
      - bash scripts/excerpts.test.sh
      - bash scripts/excerpts.test.sh mutants

  docs:ste:
    desc: Report where the book's text breaks the STE rules that a script can check and the word decisions in docs/book/ste.md (-- --strict FILE... fails on a problem; needs task setup)
    cmds:
      - bash scripts/ste.sh {{.CLI_ARGS}}

  docs:ste:test:
    desc: Prove the STE check passes CONTEXT.md and SUMMARY.md and fails a planted problem for each rule, and that each removed rule fails a control (needs task setup)
    silent: true
    cmds:
      - bash scripts/ste.test.sh
      - bash scripts/ste.test.sh mutants

  docs:breaks:
    desc: Report each run of prose in a chapter of the book that is longer than 450 words (-- --strict FILE... fails on a long run; needs task setup)
    cmds:
      - bash scripts/breaks.sh {{.CLI_ARGS}}

  docs:breaks:test:
    desc: Prove the prose-break check passes a run at the limit and fails a longer run, that a figure, table or code block breaks a run and a heading or list does not, and that each removed rule fails a control (needs task setup)
    silent: true
    cmds:
      - bash scripts/breaks.test.sh
      - bash scripts/breaks.test.sh mutants

  book:integrity:
    desc: Verify the pinned mdBook fetch, cache reuse and refusal of a bad download offline
    silent: true
    cmds:
      - bash scripts/book-integrity.test.sh

  book:bun:integrity:
    desc: Verify the checkout-local book Bun fetch, cache recovery and refusal of corrupt downloads offline
    silent: true
    cmds:
      - bash scripts/book-bun.test.sh

  notices:setup:
    desc: Install checkout-local cargo-about 0.8.4 and fetch locked Cargo sources for licence scanning
    cmds:
      - bash scripts/notices.sh setup

  notices:
    desc: Generate Rust dependency notices from the locked release graph; refuse unapproved licences
    cmds:
      - task: notices:setup
      - bash scripts/notices.sh generate

  notices:test:
    desc: Exercise real Cargo notice acceptance, refusal, atomic output and tool-version controls
    cmds:
      - task: notices:setup
      - bash scripts/notices.test.sh

  setup:
    desc: Fetch and verify the pinned checkout-local book tools (Bun, mdBook, Typst with CeTZ and figure fonts)
    cmds:
      - bash scripts/book-bun.sh setup
      - bash scripts/book.sh setup
      - bash scripts/figures.sh setup

  test:cli:
    desc: Run command-boundary tests (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p ravel --test cli {{.CLI_ARGS}}

  build:
    desc: Build Ravel and the local runner
    cmds:
      - cargo build --locked --workspace

  test:
    desc: Run the runner and session-runtime suites with nextest
    cmds:
      - cargo nextest run --locked --workspace

  test:session:
    desc: Run focused session-runtime checks (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p ravel {{.CLI_ARGS}}

  test:list:
    desc: List nextest cases before selecting a run (optional package/filter arguments)
    cmds:
      - cargo nextest list --locked --workspace {{.CLI_ARGS}}

  test:terminal-recovery:
    desc: Pair private real-PTY recovery receipts with actual front conversion/settlement
    cmds:
      - bash scripts/terminal-recovery-check.sh

  native-entry:build:
    desc: Build the private main-thread fixture executable for native checks
    cmds:
      # The extra cfg applies only to this isolated test binary, not dependencies
      # or installed executables. It avoids libtest's extra signal-owning thread.
      # https://doc.rust-lang.org/cargo/commands/cargo-rustc.html
      # The runner's fault feature is off by default and never installed; only
      # this isolated target turns it on, for F06's forked-child sites.
      - cargo rustc --locked -p ravel --bin ravel --profile dev --features native-faults --target-dir target/native-entry-fixture -- --cfg test -A unused

  native-entry:front:
    desc: Run the front's native-entry cases against the built private fixture
    cmds:
      - task: test:session
        vars:
          # Include the fixture-dependent cases while excluding child-only roles.
          # https://nexte.st/docs/filtersets/
          CLI_ARGS: "--bin ravel -E 'test(native_) & not test(native_entry_role) & not test(native_propagation_role)' --run-ignored all --no-fail-fast"

  native-entry:runner:
    desc: Run the runner's native-entry cases (library tests)
    cmds:
      - task: test:runner
        vars:
          CLI_ARGS: "--lib -E 'test(native_)' --no-fail-fast"

  native-entry:start:
    desc: Run the public Started-check API cases
    cmds:
      - task: test:runner
        vars:
          CLI_ARGS: "--test start_check"

  test:native-entry:
    desc: Build the private main-thread fixture and run native development checks (qualification incomplete)
    cmds:
      - task: native-entry:build
      - task: native-entry:front
      - task: native-entry:runner
      - task: native-entry:start

  native-linux:image:
    desc: Build the GNU/Linux subject image for PLATFORM (arm64 native, amd64 emulated)
    requires:
      vars:
        - name: PLATFORM
          enum: [arm64, amd64]
    cmds:
      - bash scripts/native-linux.sh image {{.PLATFORM}}

  test:native-linux:
    desc: Run current Rust, Rhai and native-entry checks on a GNU/Linux target in Docker (OUT must not exist)
    requires:
      vars:
        - name: PLATFORM
          enum: [arm64, amd64]
        - name: OUT
    cmds:
      - bash scripts/native-linux.sh campaign {{.PLATFORM}} {{.OUT}}

  test:runner:
    desc: Run focused local-runner checks (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p keyed-launch {{.CLI_ARGS}}

  check:
    desc: Check formatting, lint all targets and test the Rust workspace
    silent: true
    cmds:
      - bash scripts/check.sh

  rhai:upgrade-proof:
    desc: Prove a Rhai upgrade. Print the pin, run the rhai_* engine tests, then each hostile class in a fixed order, and fail on a missing or empty target
    cmds:
      - bash scripts/rhai-upgrade-proof.sh

  harness:smoke:claude:
    desc: "Opt-in, spends subscription usage: make one real LLM call through Claude Code with the owner's sign-in and check the route"
    cmds:
      - bash scripts/harness-smoke.sh claude

  harness:smoke:codex:
    desc: "Opt-in, spends subscription usage: make one real LLM call through Codex with the owner's sign-in and check the route"
    cmds:
      - bash scripts/harness-smoke.sh codex

  harness:smoke:test:
    desc: Test the harness smoke script against fake harnesses (no real call, run by task check)
    cmds:
      - bash scripts/harness-smoke.test.sh

  install:
    desc: Install and verify Ravel, Rhai examples and Rust notices under PREFIX (default ~/.local)
    silent: true
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" .HOME)}}'
    cmds:
      - bash scripts/install.sh "{{.PREFIX}}"

  smoke:
    desc: Build, install and smoke-test a fresh temporary prefix, direct and symlinked
    silent: true
    cmds:
      - bash scripts/installed-check.sh

  release:archives:
    desc: Build exact unreleased target archives (optional TARGETS), with no version cut
    cmds:
      - scripts/release-build.sh --unreleased {{.TARGETS}}

  release:smoke:
    desc: Rebuild and smoke unreleased archives on every selected target at its floors
    cmds:
      - task: release:archives
        vars:
          TARGETS: '{{.TARGETS}}'
      - scripts/release-smoke.sh {{.TARGETS}}

  release:test:
    desc: Exercise exact archive manifest, omission/extra/type/mode controls
    silent: true
    cmds:
      - bash scripts/release-check.sh archives

  release:formula:
    desc: Render and test an unpublished formula from the three unreleased archives
    silent: true
    cmds:
      - bash scripts/release-check.sh formula

  release:patch:
    desc: Publish and install the next patch release
    cmds:
      - task: release
        vars: {LEVEL: patch}

  release:minor:
    desc: Publish and install the next minor release
    cmds:
      - task: release
        vars: {LEVEL: minor}

  release:major:
    desc: Publish and install the next major release
    cmds:
      - task: release
        vars: {LEVEL: major}

  release:doctor:
    desc: Check all release prerequisites without cutting or publishing
    cmds:
      - scripts/release-doctor.sh

  release:notes:
    desc: Fill empty Unreleased notes from commit descriptions or explicit reviewed Markdown
    cmds:
      - bash scripts/release-notes.sh {{.CLI_ARGS}}

  release:lifecycle:test:
    desc: Test independent release refusal, order, notes, dry cuts and the book's delivery in isolated fixtures (needs task setup)
    silent: true
    cmds:
      - bash scripts/release-check.sh lifecycle

  release:
    internal: true
    requires:
      vars:
        - name: LEVEL
          enum: [patch, minor, major]
    preconditions:
      - sh: test -d .jj && test -d .git && test "$(pwd -P)" = "$(jj workspace root --name default)"
        msg: Run releases from Ravel's default colocated jj workspace.
    # Commands are sequential. Never move these to deps, which run in parallel.
    cmds:
      - |
        mkdir .jj/release-lock || {
          echo 'Another release holds .jj/release-lock. If it was interrupted, confirm it has stopped before removing the lock.' >&2
          exit 1
        }
      - defer: rmdir .jj/release-lock
      - scripts/release-doctor.sh
      - scripts/release-publish.sh --check-tap
      - scripts/release-book.sh check-remote
      - bash scripts/release-prepare.sh
      - scripts/release-publish.sh --check-tap
      - task: check
      - cargo release {{.LEVEL}}
      - cargo release {{.LEVEL}} --execute --no-confirm
      # The cut wrote the version into the book's version line. Refuse a
      # release whose tag does not carry exactly that line before it builds.
      - scripts/release-book-version.sh released "$(git describe --tags --exact-match HEAD)"
      - jj bookmark set main -r "$(git rev-parse HEAD)"
      # Build the book from the tag's own source and stage it. A failed build
      # stops here, with the cut still local and nothing pushed.
      - scripts/release-book.sh build "$(git describe --tags --exact-match HEAD)"
      - scripts/release-build.sh
      # Nothing is published before this passes: each archive in target/dist
      # matches the manifest and runs its installed layout on its target at
      # the floors. A failure leaves the cut local; chapter 11 of the book,
      # "Recover a partial release without another bump"
      # (docs/book/src/11-deliver-ravel.md), gives the recovery.
      - scripts/release-smoke.sh --archives target/dist
      - jj git push -b main
      - git push origin "$(git describe --tags --exact-match HEAD)"
      # Publication order: GitHub Release, then the book on the Pages branch,
      # then the tap. The same chapter 11 section gives the recovery for each stop.
      - scripts/release-publish.sh
      - brew update
      - |
        if brew list --versions ravel >/dev/null 2>&1; then
          brew upgrade ravel
        else
          brew install linkuistics/taps/ravel
        fi
      - brew test ravel
      - |
        tag="$(git describe --tags --exact-match HEAD)"
        version="${tag#v}"
        # The Homebrew prefix's commands, not whichever copy PATH finds first:
        # `task install` puts one in ~/.local/bin by default.
        brew_bin="$(brew --prefix)/bin"
        test "$("$brew_bin/ravel" --version)" = "ravel $version"
        gh release view "$tag" --repo Linkuistics/Ravel --json url,assets
        test "$(gh release view "$tag" --repo Linkuistics/Ravel --json assets --jq '.assets | length')" = 3
      # Last, because Pages shows a pushed branch after a delay.
      - scripts/release-book.sh live "$(git describe --tags --exact-match HEAD)"
