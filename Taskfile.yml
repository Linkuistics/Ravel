version: '3'

set: [errexit, nounset, pipefail]

tasks:
  setup:
    desc: Fetch and verify the pinned checkout-local Bun, then install worker dependencies
    cmds:
      - bash crates/ravel/scripts/dispatch.sh setup
      - task: deps

  deps:
    desc: Install the worker's pinned development dependencies (requires Bun 1.4.2)
    cmds:
      - bash crates/ravel/scripts/dispatch.sh deps

  worker:
    desc: Compile the matching policy worker and generic SDK declarations
    silent: true
    cmds:
      - bash scripts/worker-check.sh build

  typecheck:
    desc: Typecheck the worker, SDK, sample and declaration-consumer fixtures
    silent: true
    cmds:
      - bash scripts/worker-check.sh typecheck

  test:cli:
    desc: Run command-boundary tests (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p ravel --test cli {{.CLI_ARGS}}

  build:
    desc: Build the matching front, compiled worker and local runner
    cmds:
      - task: worker
      - cargo build --locked --workspace

  test:
    desc: Run the runner and session-runtime suites with nextest
    cmds:
      - cargo nextest run --locked --workspace

  test:session:
    desc: Run focused session-runtime checks (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p ravel {{.CLI_ARGS}}

  check:
    desc: Check formatting, lint all targets and test the Rust workspace
    silent: true
    cmds:
      - bash scripts/check.sh

  probes:
    desc: Build test-only hostile-runtime probes (never installed)
    silent: true
    cmds:
      - bash scripts/worker-check.sh probes

  test:hostile:
    desc: Run hostile-runtime controls through the actual front and worker
    cmds:
      - cargo nextest run --locked -p ravel --test hostile {{.CLI_ARGS}}

  install:
    desc: Install and verify the matched pair and SDK under PREFIX (default ~/.local)
    silent: true
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" .HOME)}}'
    cmds:
      - bash scripts/worker-check.sh install "{{.PREFIX}}"

  smoke:
    desc: Build, install and smoke-test a fresh temporary prefix, direct and symlinked
    silent: true
    cmds:
      - bash scripts/installed-check.sh

  runtime:integrity:
    desc: Verify pinned-runtime cache recovery and corrupt-download refusal offline
    silent: true
    cmds:
      - bash scripts/runtime-integrity.test.sh

  release:archives:
    desc: Build exact unreleased target archives (optional TARGETS), with no version cut
    cmds:
      - scripts/release-build.sh --unreleased {{.TARGETS}}

  release:smoke:
    desc: Rebuild and smoke unreleased archives on every selected target at its floors
    cmds:
      - task: release:archives
        vars:
          TARGETS: '{{.TARGETS}}'
      - scripts/release-smoke.sh {{.TARGETS}}

  release:test:
    desc: Exercise exact archive manifest, omission/extra/type/mode controls
    silent: true
    cmds:
      - bash scripts/release-check.sh archives

  release:formula:
    desc: Render and test an unpublished formula from the three unreleased archives
    silent: true
    cmds:
      - task: probes
      - bash scripts/release-check.sh formula
