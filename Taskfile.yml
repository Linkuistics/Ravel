version: '3'

set: [errexit, nounset, pipefail]

tasks:
  docs:result-job:
    desc: Serve editable result-job completion and native-entry views on localhost (Mermaid needs network access)
    vars:
      PORT: '{{.PORT | default "8774"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/result-job

  docs:components:
    desc: Serve the editable current-component views on localhost (Mermaid needs network access)
    vars:
      PORT: '{{.PORT | default "8773"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/components

  setup:
    desc: Fetch and verify the pinned checkout-local Bun, then install worker dependencies
    cmds:
      - bash crates/ravel/scripts/dispatch.sh setup
      - task: deps

  deps:
    desc: Install the worker's pinned development dependencies (requires Bun 1.4.2)
    cmds:
      - bash crates/ravel/scripts/dispatch.sh deps

  worker:
    desc: Compile the matching policy worker and generic SDK declarations
    silent: true
    cmds:
      - bash scripts/worker-check.sh build

  typecheck:
    desc: Typecheck the worker, SDK, sample and declaration-consumer fixtures
    silent: true
    cmds:
      - bash scripts/worker-check.sh typecheck

  test:cli:
    desc: Run command-boundary tests (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p ravel --test cli {{.CLI_ARGS}}

  build:
    desc: Build the matching front, compiled worker and local runner
    cmds:
      - task: worker
      - cargo build --locked --workspace

  test:
    desc: Run the runner and session-runtime suites with nextest
    cmds:
      - cargo nextest run --locked --workspace

  test:session:
    desc: Run focused session-runtime checks (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p ravel {{.CLI_ARGS}}

  test:list:
    desc: List nextest cases before selecting a run (optional package/filter arguments)
    cmds:
      - cargo nextest list --locked --workspace {{.CLI_ARGS}}

  test:terminal-recovery:
    desc: Pair private real-PTY recovery receipts with actual front conversion/settlement
    cmds:
      - bash scripts/terminal-recovery-check.sh

  native-entry:build:
    desc: Build the worker and the private main-thread fixture executable for native checks
    cmds:
      - task: worker
      # The extra cfg applies only to this isolated test binary, not dependencies
      # or installed executables. It avoids libtest's extra signal-owning thread.
      # https://doc.rust-lang.org/cargo/commands/cargo-rustc.html
      # The runner's fault feature is off by default and never installed; only
      # this isolated target turns it on, for F06's forked-child sites.
      - cargo rustc --locked -p ravel --bin ravel --profile dev --features native-faults --target-dir target/native-entry-fixture -- --cfg test -A unused

  native-entry:front:
    desc: Run the front's native-entry cases against the built private fixture
    cmds:
      - task: test:session
        vars:
          # Include the fixture-dependent cases while excluding child-only roles.
          # https://nexte.st/docs/filtersets/
          CLI_ARGS: "--bin ravel -E 'test(native_) & not test(native_entry_role) & not test(native_propagation_role)' --run-ignored all --no-fail-fast"

  native-entry:runner:
    desc: Run the runner's native-entry cases (library tests)
    cmds:
      - task: test:runner
        vars:
          CLI_ARGS: "--lib -E 'test(native_)' --no-fail-fast"

  native-entry:start:
    desc: Run the public Started-check API cases
    cmds:
      - task: test:runner
        vars:
          CLI_ARGS: "--test start_check"

  test:native-entry:
    desc: Build the private main-thread fixture and run native development checks (qualification incomplete)
    cmds:
      - task: native-entry:build
      - task: native-entry:front
      - task: native-entry:runner
      - task: native-entry:start

  test:native-campaign:
    desc: Freeze subjects, run the finite native cases and reconcile every row (DIR must not exist)
    cmds:
      - bash scripts/native-campaign.sh run --out {{.DIR}}

  test:native-campaign-controls:
    desc: Prove the campaign driver rejects drifted digests, duplicate writers and unreconciled rows
    cmds:
      - bash scripts/native-campaign.sh selftest

  test:runner:
    desc: Run focused local-runner checks (optional nextest arguments)
    cmds:
      - cargo nextest run --locked -p keyed-launch {{.CLI_ARGS}}

  check:
    desc: Check formatting, lint all targets and test the Rust workspace
    silent: true
    cmds:
      - bash scripts/check.sh

  probes:
    desc: Build test-only hostile-runtime probes (never installed)
    silent: true
    cmds:
      - bash scripts/worker-check.sh probes

  test:hostile:
    desc: Run hostile-runtime controls through the actual front and worker
    cmds:
      - cargo nextest run --locked -p ravel --test hostile {{.CLI_ARGS}}

  install:
    desc: Install and verify the matched pair and SDK under PREFIX (default ~/.local)
    silent: true
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" .HOME)}}'
    cmds:
      - bash scripts/worker-check.sh install "{{.PREFIX}}"

  smoke:
    desc: Build, install and smoke-test a fresh temporary prefix, direct and symlinked
    silent: true
    cmds:
      - bash scripts/installed-check.sh

  runtime:integrity:
    desc: Verify pinned-runtime cache recovery and corrupt-download refusal offline
    silent: true
    cmds:
      - bash scripts/runtime-integrity.test.sh

  release:archives:
    desc: Build exact unreleased target archives (optional TARGETS), with no version cut
    cmds:
      - scripts/release-build.sh --unreleased {{.TARGETS}}

  release:smoke:
    desc: Rebuild and smoke unreleased archives on every selected target at its floors
    cmds:
      - task: release:archives
        vars:
          TARGETS: '{{.TARGETS}}'
      - scripts/release-smoke.sh {{.TARGETS}}

  release:test:
    desc: Exercise exact archive manifest, omission/extra/type/mode controls
    silent: true
    cmds:
      - bash scripts/release-check.sh archives

  release:formula:
    desc: Render and test an unpublished formula from the three unreleased archives
    silent: true
    cmds:
      - task: probes
      - bash scripts/release-check.sh formula

  release:patch:
    desc: Publish and install the next patch release
    cmds:
      - task: release
        vars: {LEVEL: patch}

  release:minor:
    desc: Publish and install the next minor release
    cmds:
      - task: release
        vars: {LEVEL: minor}

  release:major:
    desc: Publish and install the next major release
    cmds:
      - task: release
        vars: {LEVEL: major}

  release:doctor:
    desc: Check all release prerequisites without cutting or publishing
    cmds:
      - scripts/release-doctor.sh

  release:notes:
    desc: Fill empty Unreleased notes from commit descriptions or explicit reviewed Markdown
    cmds:
      - bash scripts/release-notes.sh {{.CLI_ARGS}}

  release:lifecycle:test:
    desc: Test independent release refusal, order, notes and dry cuts in isolated fixtures
    silent: true
    cmds:
      - bash scripts/release-check.sh lifecycle

  release:
    internal: true
    requires:
      vars:
        - name: LEVEL
          enum: [patch, minor, major]
    preconditions:
      - sh: test -d .jj && test -d .git && test "$(pwd -P)" = "$(jj workspace root --name default)"
        msg: Run releases from Ravel's default colocated jj workspace.
    # Commands are sequential. Never move these to deps, which run in parallel.
    cmds:
      - |
        mkdir .jj/release-lock || {
          echo 'Another release holds .jj/release-lock. If it was interrupted, confirm it has stopped before removing the lock.' >&2
          exit 1
        }
      - defer: rmdir .jj/release-lock
      - scripts/release-doctor.sh
      - scripts/release-publish.sh --check-tap
      - bash scripts/release-prepare.sh
      - scripts/release-publish.sh --check-tap
      - task: check
      - cargo release {{.LEVEL}}
      - cargo release {{.LEVEL}} --execute --no-confirm
      - jj bookmark set main -r "$(git rev-parse HEAD)"
      - scripts/release-build.sh
      # Nothing is published before this passes: each archive in target/dist
      # matches the manifest and runs its installed layout on its target at
      # the floors. A failure leaves the cut local; docs/RELEASING.md,
      # "If the installed smoke test fails", gives the recovery.
      - scripts/release-smoke.sh --archives target/dist
      - jj git push -b main
      - git push origin "$(git describe --tags --exact-match HEAD)"
      - scripts/release-publish.sh
      - brew update
      - |
        if brew list --versions ravel >/dev/null 2>&1; then
          brew upgrade ravel
        else
          brew install linkuistics/taps/ravel
        fi
      - brew test ravel
      - |
        tag="$(git describe --tags --exact-match HEAD)"
        version="${tag#v}"
        # The Homebrew prefix's commands, not whichever copy PATH finds first:
        # `task install` puts one in ~/.local/bin by default.
        brew_bin="$(brew --prefix)/bin"
        test "$("$brew_bin/ravel" --version)" = "ravel $version"
        gh release view "$tag" --repo Linkuistics/Ravel --json url,assets
        test "$(gh release view "$tag" --repo Linkuistics/Ravel --json assets --jq '.assets | length')" = 3
