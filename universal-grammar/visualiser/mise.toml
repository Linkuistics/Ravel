[tools]
python = "3.15"
task = "3.54"
# https://mise.jdx.dev/lang/rust.html#targets
rust = { version = "1.100.0", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
# The workbench page: Node 26 is the LTS line on 2026-11-19, and pnpm installs
# the packages of `page/package.json`.
node = "26.13.1"
pnpm = "12.21.0"
# The command must have the version of the crate `wasm-bindgen` in Cargo.toml.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
