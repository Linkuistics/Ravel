[package]
name = "workbench-wasm"
version = "0.1.0"
description = "The WebAssembly bindings of the workbench core, for the workbench page."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
workbench-core = { path = "../core", features = ["wasm"] }
serde.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true
