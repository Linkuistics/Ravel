<text x="150.0" y="108.0" class="passt" text-anchor="middle">pass 1</text>
<rect x="304" y="46.0" width="100" height="44" rx="12" class="nextmark"/>
<rect x="386" y="41.0" width="18" height="15" rx="4" class="nextbtn"/>
<text x="395" y="52.0" class="nextbtnt" text-anchor="middle">▸</text>
<circle cx="484.0" cy="68.0" r="17.0" class="nextmark"/>
<rect x="490.0" y="46.0" width="18" height="15" rx="4" class="nextbtn"/>
<text x="499.0" y="57.0" class="nextbtnt" text-anchor="middle">▸</text>
<text x="506.0" y="72.0" class="cur sm">then introduce_concept</text>
<circle cx="94.0" cy="46.0" r="9" class="call"/>
<text x="94.0" y="50.0" class="callt" text-anchor="middle">1</text>
<circle cx="506.0" cy="44.0" r="9" class="call"/>
<text x="506.0" y="48.0" class="callt" text-anchor="middle">2</text>
<path d="M118 39.0 h20 v13 l-10 5 l-10 -5z" class="tab"/>
<text x="128" y="50.5" class="tabt" text-anchor="middle">1</text></g>
<circle cx="710.1" cy="87.0" r="9" class="call"/>
<text x="710.1" y="91.0" class="callt" text-anchor="middle">1</text>
<text x="727.1" y="91" class="note">install is a rule for one step, so its</text>
<text x="727.1" y="107" class="note">reference box looks like a task, and the</text>
<text x="727.1" y="123" class="note">marker sits on it. Another install starts</text>
<text x="727.1" y="139" class="note">pass 2.</text>
<circle cx="710.1" cy="161.0" r="9" class="call"/>
<text x="710.1" y="165.0" class="callt" text-anchor="middle">2</text>
<text x="727.1" y="165" class="note">The end event carries a mark when a next</text>
<text x="727.1" y="181" class="note">option lies after this rule. Its popover</text>
<text x="727.1" y="197" class="note">names the symbols, here</text>
<text x="727.1" y="213" class="note">introduce_concept.</text>
<rect x="16" y="267.0" width="910" height="229.0" rx="8" class="panel"/>
<text x="28" y="287.0" class="b">tutorial</text>
<text x="28" y="305.0" class="m sm">The whole tutorial.</text>
<g transform="translate(28,314.0)"><circle cx="28.0" cy="68.0" r="12.0" class="ev"/>
<path d="M40.0 68.0 L64.0 68.0" class="flow" marker-end="url(#ah)"/>
