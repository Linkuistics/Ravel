<text x="693.0" y="72.0" class="lab" text-anchor="middle" xml:space="preserve">suggest_next_steps</text>
<path d="M576.0 56.0 L576.0 22.0 Q576.0 16.0 582.0 16.0 L804.0 16.0 Q810.0 16.0 810.0 22.0 L810.0 56.0" class="flow" marker-end="url(#ah)"/>
