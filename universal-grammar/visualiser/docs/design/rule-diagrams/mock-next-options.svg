<text x="188" y="44.5" class="tabt" text-anchor="middle">1</text></g>
<circle cx="949.0" cy="280.0" r="9" class="call"/>
<text x="949.0" y="284.0" class="callt" text-anchor="middle">3</text>
<text x="966" y="284.0" class="note">One level up, the marker sits on the</text>
<text x="966" y="300.0" class="note">reference box that holds the reading. The</text>
<text x="966" y="316.0" class="note">mark on setup says that the next step can</text>
<text x="966" y="332.0" class="note">stay inside it: install or configure.</text>
<circle cx="949.0" cy="354.0" r="9" class="call"/>
<text x="949.0" y="358.0" class="callt" text-anchor="middle">4</text>
<text x="966" y="358.0" class="note">The mark on lesson says that the next</text>
<text x="966" y="374.0" class="note">step can enter lesson. Its ▸ button opens</text>
<text x="966" y="390.0" class="note">a popover with the symbols that pass</text>
<text x="966" y="406.0" class="note">through the box.</text>
</svg>
