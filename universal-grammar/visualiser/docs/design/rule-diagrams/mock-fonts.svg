<text x="16" y="26" class="h1">Decision: a bundled monospace font or a proportional font with a width table</text>
<text x="16" y="46" class="m">The same two rules in both fonts. The layout constants are equal, and only the text widths differ. Agreed: the bundled monospace font.</text>
<text x="16" y="69" class="b">Bundled monospace font, 0.6 em for each cell (agreed)</text>
