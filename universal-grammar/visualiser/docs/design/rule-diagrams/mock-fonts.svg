<text x="882" y="631.0" class="note">Diagram: 802 by 129 px. The longest label</text>
<text x="882" y="647.0" class="note">takes 1 lines.</text>
<text x="42" y="810.0" class="note">Both fonts use the same limit of 140 px for one line. The proportional font fits a whole phrase on one line, and the monospace font</text>
<text x="42" y="826.0" class="note">wraps it. So the monospace diagrams are narrower and taller.</text>
<text x="42" y="852.0" class="note">Measured in Chromium on macOS, as em for each character: Menlo 0.602, SF Mono 0.618, Courier New 0.600, Monaco 0.600. Chromium has</text>
<text x="42" y="868.0" class="note">no ui-monospace, and Safari maps it to SF Mono. A system font therefore differs from the width that the core assumes by up to 3 % on</text>
<text x="42" y="884.0" class="note">this machine. Fonts on other systems were not measured. A bundled font removes the difference.</text>
<text x="42" y="910.0" class="note">A monospace font gives each character its own cell. Symbols that differ only by case, spaces, _ or - stay easy to tell apart, and</text>
<text x="42" y="926.0" class="note">the rule checks warn about exactly those symbols.</text>
</svg>
