<text x="868" y="91" class="note">Sequence: the children in a row, joined</text>
<text x="868" y="107" class="note">by flows of 24 px.</text>
<text x="868" y="133" class="note">Repetition {0,2}: two gateway pairs, a</text>
<text x="868" y="149" class="note">skip flow above and a back flow below.</text>
<text x="868" y="175" class="note">Choice: the first alternative on the main</text>
<text x="868" y="191" class="note">line, the next ones below it, in the</text>
<text x="868" y="207" class="note">order of the text.</text>
<text x="868" y="233" class="note">An edit inside one frame changes the size</text>
<text x="868" y="249" class="note">of that frame and of its ancestors.</text>
<text x="868" y="265" class="note">Elements after it move, but none changes</text>
<text x="868" y="281" class="note">its order.</text>
