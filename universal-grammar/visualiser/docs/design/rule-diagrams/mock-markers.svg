<text x="851.0" y="331.0" class="callt" text-anchor="middle">3</text>
<text x="868" y="331.0" class="note">The grammar view follows the reading on</text>
<text x="868" y="347.0" class="note">view into approval. Its marker sits on</text>
<text x="868" y="363.0" class="note">the task box of the step just read.</text>
<circle cx="851.0" cy="385.0" r="9" class="call"/>
<text x="851.0" y="389.0" class="callt" text-anchor="middle">4</text>
<text x="868" y="389.0" class="note">The loop shows only its current pass:</text>
<text x="868" y="405.0" class="note">pass 1 of 0 to 2. Another reminder starts</text>
<text x="868" y="421.0" class="note">pass 2, so the back flow carries the</text>
<text x="868" y="437.0" class="note">next-option colour.</text>
<circle cx="851.0" cy="459.0" r="9" class="call"/>
<text x="851.0" y="463.0" class="callt" text-anchor="middle">5</text>
<text x="868" y="463.0" class="note">Next options of reading 1: remind,</text>
<text x="868" y="479.0" class="note">approve and escalate. The ▸ button on a</text>
<text x="868" y="495.0" class="note">mark appends that symbol.</text>
<text x="16" y="585.0" class="b">A reading marker is not a BPMN token</text>
