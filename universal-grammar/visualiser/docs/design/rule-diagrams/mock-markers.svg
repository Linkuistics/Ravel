<text x="566" y="181" class="note">outlined tab is a reading that the output</text>
<text x="566" y="197" class="note">view does not show. A dashed outline</text>
<text x="566" y="213" class="note">marks next options that only other</text>
<text x="566" y="229" class="note">readings allow.</text>
