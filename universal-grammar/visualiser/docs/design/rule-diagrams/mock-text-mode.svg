<svg xmlns="http://www.w3.org/2000/svg" width="1386" height="564" viewBox="0 0 1386 564">
<style>
:root{--bg:#ffffff;--panel:#fbfbfc;--hdr:#f1f3f6;--line:#d5dae2;--t:#1d2330;--m:#677184;
--cur:#0e7c66;--curbg:#e3f4ef;--sel:#d99a00;--e:#b3261e;--ebg:#fdecea;--chip:#eceff4;
--note:#2b3445;--box:#ffffff;--boxl:#5f6878;--gw:#ffffff;--ref:#1f4fa3;--frame:#c9ced8;
--tok:#2f6fd6;--lbl:#f4f5f7;--code:#f4f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#15171c;--panel:#1b1e25;--hdr:#232731;
--line:#363c48;--t:#e5e8ee;--m:#9aa3b3;--cur:#4fd1b5;--curbg:#173a33;--sel:#f2c94c;
--e:#ff7b72;--ebg:#3b1f22;--chip:#2a2f3b;--note:#d5dae3;--box:#1f232b;--boxl:#9aa3b3;
--gw:#1f232b;--ref:#8fb4ff;--frame:#3a404c;--tok:#6ea8ff;--lbl:#232731;--code:#20242c}}
svg{background:var(--bg)}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:var(--t)}
.lab{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:var(--t)}
.labp{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--t)}
.m{fill:var(--m)} .b{font-weight:700} .sm{font-size:11px} .e{fill:var(--e);font-weight:600}
.cur{fill:var(--cur);font-weight:600} .refc{fill:var(--ref);font-weight:600}
.h1{font-size:15px;font-weight:700} .h2{font-size:12px;font-weight:700;fill:var(--m);letter-spacing:.04em}
.panel{fill:var(--panel);stroke:var(--line)} .hdr{fill:var(--hdr)}
.task{fill:var(--box);stroke:var(--boxl);stroke-width:1.4}
.refbox{fill:var(--box);stroke:var(--boxl);stroke-width:3.2}
.gw{fill:var(--gw);stroke:var(--boxl);stroke-width:1.4} .gwx{stroke:var(--boxl);stroke-width:1.8}
.ev{fill:var(--box);stroke:var(--boxl);stroke-width:1.4} .evend{fill:var(--box);stroke:var(--boxl);stroke-width:3.6}
.flow{stroke:var(--boxl);stroke-width:1.4;fill:none}
.ah{fill:var(--boxl)} .drill{fill:var(--box);stroke:var(--boxl);stroke-width:1.2}
.lblbg{fill:var(--bg)} .lbl{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--m)}
.tab{fill:var(--cur);stroke:var(--cur);stroke-width:1.2} .tabo{fill:var(--bg);stroke:var(--cur);stroke-width:1.4}
.tabt{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:700;fill:var(--bg)} .tabto{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:700;fill:var(--cur)}
.nextmark{fill:none;stroke:var(--cur);stroke-width:2} .nextmarko{fill:none;stroke:var(--cur);stroke-width:2;stroke-dasharray:5 3}
.nextbtn{fill:var(--cur)} .nextbtnt{font-size:10px;font-weight:700;fill:var(--bg)}
.passbg{fill:var(--curbg);stroke:var(--cur);stroke-width:1} .passt{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--cur);font-weight:600}
.sel{fill:none;stroke:var(--sel);stroke-width:2.6} .selflow{fill:none;stroke:var(--sel);stroke-width:5;opacity:.55}
.backmark{fill:none;stroke:var(--cur);stroke-width:4;opacity:.45}
.data{fill:var(--box);stroke:var(--boxl);stroke-width:1.2} .assoc{stroke:var(--boxl);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.badge{fill:var(--chip)} .chip{fill:var(--curbg);stroke:var(--cur)} .chipt{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--cur)}
.pop{fill:var(--bg);stroke:var(--line)} .banner{fill:var(--ebg);stroke:var(--e)}
.call{fill:var(--t)} .callt{fill:var(--bg);font-size:11px;font-weight:700}
.note{fill:var(--note)} .nest{fill:none;stroke:var(--m);stroke-width:1;stroke-dasharray:3 3}
.nestt{font-size:10px;fill:var(--m)} .tok{fill:var(--tok)} .tokt{font-size:10px;font-weight:700;fill:#fff}
.code{fill:var(--code);stroke:var(--line)} .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.crumb{fill:var(--ref)} .rejbox{fill:none;stroke:var(--e);stroke-width:2;stroke-dasharray:4 3}
.strike{fill:none;stroke:var(--m);stroke-width:1.3}
.loopbar{fill:none;stroke:var(--cur);stroke-width:2.5;stroke-linecap:round}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<text x="16" y="26" class="h1">Sketch: a rule as text, with parts that open as diagrams</text>
<text x="16" y="46" class="m">The tutorial after overview · install · introduce_concept · show_example · set_exercise · give_hint. Each item of the rule is one line. Text mode comes after the slice. The</text>
<text x="16" y="63" class="m">human described it as program text: whole constructs with implicit structure, and embedded diagrams for some parts. This first sketch draws more structure than that.</text>
<rect x="16" y="74" width="1010" height="464.0" rx="8" class="panel"/>
<text x="28" y="94" class="b">tutorial</text>
<text x="28" y="112" class="m sm">The whole tutorial.</text>
<rect x="876" y="82" width="138" height="20" rx="10" class="badge"/>
<rect x="878" y="84" width="58" height="16" rx="8" class="chip"/>
<text x="907" y="96" class="chipt" text-anchor="middle">text</text>
<text x="974" y="96" class="lbl" text-anchor="middle">diagrams</text>
<text x="72" y="144" class="mono">overview</text>
<text x="436" y="144" class="m sm">State what the reader builds and what the reader must know first.</text>
<text x="56" y="170" class="m">▸</text>
<text x="72" y="170" class="mono b">setup</text>
<text x="436" y="170" class="m sm">Prepare the machine of the reader: one install step for each tool.</text>
<rect x="934" y="157" width="76" height="18" rx="9" class="badge"/>
<text x="972" y="170" class="lbl" text-anchor="middle">◇ diagram</text>
<text x="56" y="196" class="m">▾</text>
<text x="72" y="196" class="mono b">lesson</text>
<text x="125.2" y="196" class="lbl">1 or more · pass 1</text>
<text x="436" y="196" class="m sm">One lesson teaches one concept, with one to three examples.</text>
<rect x="934" y="183" width="76" height="18" rx="9" class="badge"/>
<text x="972" y="196" class="lbl" text-anchor="middle">◇ diagram</text>
<text x="92" y="222" class="mono">introduce_concept</text>
<text x="436" y="222" class="m sm">Introduce one new concept in plain words.</text>
<text x="92" y="248" class="mono">show_example</text>
<text x="188.4" y="248" class="lbl">1 to 3</text>
<text x="436" y="248" class="m sm">Show a short worked example of the concept.</text>
<text x="76" y="274" class="m">▾</text>
<text x="92" y="274" class="mono b">practice</text>
<text x="159.6" y="274" class="lbl">0 or more · pass 1</text>
<text x="436" y="274" class="m sm">One exercise, with its hints and its solution.</text>
<rect x="934" y="261" width="76" height="18" rx="9" class="chip"/>
<text x="972" y="274" class="chipt" text-anchor="middle">◇ diagram</text>
<rect x="92" y="292" width="676" height="148.0" rx="8" class="panel"/>
<text x="102" y="309" class="m sm">practice · diagram</text>
<g transform="translate(96,314)"><circle cx="28.0" cy="68.0" r="12.0" class="ev"/>
<path d="M40.0 68.0 L64.0 68.0" class="flow" marker-end="url(#ah)"/>
<rect x="64" y="50.0" width="114" height="36" rx="9" class="refbox"/>
<text x="121.0" y="72.0" class="lab" text-anchor="middle" xml:space="preserve">set_exercise</text>
<path d="M178.0 68.0 L202.0 68.0" class="flow" marker-end="url(#ah)"/>
<path d="M202 68.0 L214.0 56.0 L226 68.0 L214.0 80.0z" class="gw"/>
<path d="M226.0 68.0 L236.0 68.0" class="flow" marker-end="url(#ah)"/>
<path d="M236 68.0 L248.0 56.0 L260 68.0 L248.0 80.0z" class="gw"/>
<path d="M260.0 68.0 L284.0 68.0" class="flow" marker-end="url(#ah)"/>
<rect x="284" y="50.0" width="92" height="36" rx="9" class="refbox"/>
<text x="330.0" y="72.0" class="lab" text-anchor="middle" xml:space="preserve">give_hint</text>
<path d="M376.0 68.0 L400.0 68.0" class="flow" marker-end="url(#ah)"/>
<path d="M400 68.0 L412.0 56.0 L424 68.0 L412.0 80.0z" class="gw"/>
<path d="M412.0 80.0 L412.0 98.0 Q412.0 104.0 406.0 104.0 L254.0 104.0 Q248.0 104.0 248.0 98.0 L248.0 80.0" class="flow" marker-end="url(#ah)"/>
<path d="M424.0 68.0 L434.0 68.0" class="flow" marker-end="url(#ah)"/>
<path d="M434 68.0 L446.0 56.0 L458 68.0 L446.0 80.0z" class="gw"/>
<path d="M214.0 56.0 L214.0 22.0 Q214.0 16.0 220.0 16.0 L440.0 16.0 Q446.0 16.0 446.0 22.0 L446.0 56.0" class="flow" marker-end="url(#ah)"/>
<path d="M458.0 68.0 L482.0 68.0" class="flow" marker-end="url(#ah)"/>
<rect x="482" y="50.0" width="122" height="36" rx="9" class="refbox"/>
<text x="543.0" y="72.0" class="lab" text-anchor="middle" xml:space="preserve">show_solution</text>
<path d="M604.0 68.0 L628.0 68.0" class="flow" marker-end="url(#ah)"/>
<circle cx="640.0" cy="68.0" r="10.8" class="evend"/>
<rect x="280" y="46.0" width="100" height="44" rx="12" class="nextmark"/>
<rect x="362" y="41.0" width="18" height="15" rx="4" class="nextbtn"/>
<text x="371" y="52.0" class="nextbtnt" text-anchor="middle">▸</text>
<path d="M412.0 80.0 L412.0 98.0 Q412.0 104.0 406.0 104.0 L254.0 104.0 Q248.0 104.0 248.0 98.0 L248.0 80.0" class="backmark"/>
<rect x="304.2" y="95.0" width="51.6" height="18" rx="9" class="passbg"/>
<text x="330.0" y="108.0" class="passt" text-anchor="middle">pass 1</text>
<rect x="478" y="46.0" width="130" height="44" rx="12" class="nextmark"/>
<rect x="590" y="41.0" width="18" height="15" rx="4" class="nextbtn"/>
<text x="599" y="52.0" class="nextbtnt" text-anchor="middle">▸</text>
<path d="M290 39.0 h20 v13 l-10 5 l-10 -5z" class="tab"/>
<text x="300" y="50.5" class="tabt" text-anchor="middle">1</text></g>
<text x="92" y="466.0" class="mono">check_understanding</text>
<text x="238.8" y="466.0" class="lbl">optional</text>
<text x="436" y="466.0" class="m sm">Ask two or three questions that check the concept.</text>
<text x="72" y="492.0" class="mono">summarise</text>
<text x="436" y="492.0" class="m sm">Sum up what the reader learned.</text>
<text x="72" y="518.0" class="mono">suggest_next_steps</text>
<text x="211.6" y="518.0" class="lbl">optional</text>
<text x="436" y="518.0" class="m sm">Point the reader to further material.</text>
<path d="M62 206 V472.0" class="loopbar"/>
<circle cx="30.0" cy="140.0" r="9" class="call"/>
<text x="30.0" y="144.0" class="callt" text-anchor="middle">1</text>
<circle cx="30.0" cy="192.0" r="9" class="call"/>
<text x="30.0" y="196.0" class="callt" text-anchor="middle">2</text>
<circle cx="30.0" cy="270.0" r="9" class="call"/>
<text x="30.0" y="274.0" class="callt" text-anchor="middle">3</text>
<circle cx="30.0" cy="166.0" r="9" class="call"/>
<text x="30.0" y="170.0" class="callt" text-anchor="middle">4</text>
<circle cx="862.0" cy="92.0" r="9" class="call"/>
<text x="862.0" y="96.0" class="callt" text-anchor="middle">5</text>
<circle cx="1049.0" cy="87.0" r="9" class="call"/>
<text x="1049.0" y="91.0" class="callt" text-anchor="middle">1</text>
<text x="1066" y="91" class="note">Each item of the rule is one line, in the</text>
<text x="1066" y="107" class="note">order of the text. A rule for one step shows</text>
<text x="1066" y="123" class="note">its doc string, so the rule reads like the</text>
<text x="1066" y="139" class="note">plan of a tutorial.</text>
<circle cx="1049.0" cy="161.0" r="9" class="call"/>
<text x="1049.0" y="165.0" class="callt" text-anchor="middle">2</text>
<text x="1066" y="165" class="note">lesson is open as text, like a fold in a code</text>
<text x="1066" y="181" class="note">editor. A repetition shows its bound in words</text>
<text x="1066" y="197" class="note">and its current pass. The bar marks the lines</text>
<text x="1066" y="213" class="note">of the loop.</text>
<circle cx="1049.0" cy="235.0" r="9" class="call"/>
<text x="1049.0" y="239.0" class="callt" text-anchor="middle">3</text>
<text x="1066" y="239" class="note">practice is open as a diagram: a part to</text>
<text x="1066" y="255" class="note">inspect. Its marks are those of the diagram</text>
<text x="1066" y="271" class="note">view. The diagram button of a line opens or</text>
<text x="1066" y="287" class="note">closes its diagram.</text>
<circle cx="1049.0" cy="309.0" r="9" class="call"/>
<text x="1049.0" y="313.0" class="callt" text-anchor="middle">4</text>
<text x="1066" y="313" class="note">setup stays closed. Its ▸ opens it as text,</text>
<text x="1066" y="329" class="note">and its diagram button opens it as a diagram.</text>
<circle cx="1049.0" cy="351.0" r="9" class="call"/>
<text x="1049.0" y="355.0" class="callt" text-anchor="middle">5</text>
<text x="1066" y="355" class="note">Text or diagrams: whether the grammar or the</text>
<text x="1066" y="371" class="note">person chooses stays open, as for the text</text>
<text x="1066" y="387" class="note">presentation of the output view.</text>
<text x="1066" y="413" class="note">The reading marker sits on the innermost</text>
<text x="1066" y="429" class="note">element in view that holds the reading. Here</text>
<text x="1066" y="445" class="note">that is give_hint, inside the diagram of</text>
<text x="1066" y="461" class="note">practice.</text>
</svg>
