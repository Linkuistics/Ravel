<circle cx="30.0" cy="536.0" r="9" class="call"/>
<text x="30.0" y="540.0" class="callt" text-anchor="middle">3</text>
<text x="120" y="562" class="mono">("review-design" "integrate-review-design")*</text>
<text x="604" y="562" class="lbl" text-anchor="end">pass 1</text>
<text x="60" y="584" class="lbl" text-anchor="end">34</text>
<text x="136" y="584" class="mono">"review-design"</text>
<rect x="254.0" y="572" width="165.8" height="17" rx="8" class="chip"/>
<text x="261.0" y="584" class="chipt">rule-diagram-design-k38</text>
<circle cx="30.0" cy="580.0" r="9" class="call"/>
<text x="30.0" y="584.0" class="callt" text-anchor="middle">4</text>
<text x="60" y="606" class="lbl" text-anchor="end">35</text>
<text x="136" y="606" class="mono">"integrate-review-design"</text>
<rect x="326.0" y="594" width="165.8" height="17" rx="8" class="chip"/>
<text x="333.0" y="606" class="chipt">rule-diagram-design-k39</text>
<circle cx="639.0" cy="417.0" r="9" class="call"/>
<text x="639.0" y="421.0" class="callt" text-anchor="middle">3</text>
<text x="656" y="421" class="note">Step 33 keeps its number and its place, struck</text>
<text x="656" y="437" class="note">through. It belongs to no node, as the rejected</text>
<text x="656" y="453" class="note">step at a failure point does.</text>
<circle cx="639.0" cy="475.0" r="9" class="call"/>
<text x="639.0" y="479.0" class="callt" text-anchor="middle">4</text>
<text x="656" y="479" class="note">The replacement review, step 34, fits the</text>
<text x="656" y="495" class="note">grammar, so the tree stays well formed. A click</text>
<text x="656" y="511" class="note">on row 33 outlines the boxes that it matched in</text>
<text x="656" y="527" class="note">the state before it.</text>
<rect x="16" y="644" width="1095.45" height="189.0" rx="8" class="panel"/>
<text x="28" y="664" class="crumb">grove</text>
<text x="68.375" y="664" class="m">›</text>
<text x="82.375" y="664" class="crumb">work</text>
<text x="115.875" y="664" class="m">›</text>
<text x="129.875" y="664" class="b">design</text>
<text x="28" y="682" class="m sm">The grammar view of the same state, after step 35.</text>
