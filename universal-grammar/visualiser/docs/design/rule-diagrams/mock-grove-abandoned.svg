<rect x="141.2" y="254" width="132.8" height="17" rx="8" class="chip"/>
<text x="148.2" y="266" class="chipt">angular-costs-k390</text>
<text x="88" y="288" class="mono">("review-impl" "integrate-review-impl")*</text>
<text x="604" y="288" class="lbl" text-anchor="end">pass 1</text>
<text x="60" y="310" class="lbl" text-anchor="end">7</text>
<text x="104" y="310" class="mono">"review-impl"</text>
<rect x="207.6" y="298" width="132.8" height="17" rx="8" class="chip"/>
<text x="214.6" y="310" class="chipt">angular-costs-k393</text>
<text x="60" y="332" class="lbl" text-anchor="end">8</text>
<text x="104" y="332" class="mono">"integrate-review-impl"</text>
<rect x="279.6" y="320" width="132.8" height="17" rx="8" class="chip"/>
<text x="286.6" y="332" class="chipt">angular-costs-k394</text>
<circle cx="639.0" cy="121.0" r="9" class="call"/>
<text x="639.0" y="125.0" class="callt" text-anchor="middle">1</text>
<text x="656" y="125" class="note">Each chip is the leaf of the step, an attribute</text>
<text x="656" y="141" class="note">that the grammar never reads. The rows number</text>
<text x="656" y="157" class="note">the steps from the start of the node, and the</text>
<text x="656" y="173" class="note">leaf names drop the prefix of the node.</text>
<circle cx="639.0" cy="195.0" r="9" class="call"/>
<text x="639.0" y="199.0" class="callt" text-anchor="middle">2</text>
<text x="656" y="199" class="note">The node holds nine leaves in this order. The</text>
<text x="656" y="215" class="note">human abandoned the fifth, semantic-controls,</text>
<text x="656" y="231" class="note">and the sixth, angular-costs, took its place</text>
<text x="656" y="247" class="note">with a review.</text>
<text x="16" y="382" class="b">A review that a review with changed content replaces</text>
<rect x="16" y="404" width="600" height="218" rx="8" class="panel"/>
<text x="28" y="398" class="m sm">Output view, roughly: this grove, if the human abandons the review of this design</text>
<text x="72" y="430" class="mono">work*</text>
<text x="604" y="430" class="lbl" text-anchor="end">pass 12</text>
<text x="60" y="452" class="lbl" text-anchor="end">2–31</text>
<text x="88" y="452" class="mono m">completed · 11 passes · 30 steps</text>
<text x="88" y="474" class="mono m">pass 12</text>
<text x="104" y="496" class="mono b">design</text>
<text x="60" y="518" class="lbl" text-anchor="end">32</text>
<text x="120" y="518" class="mono">"design"</text>
<rect x="187.6" y="506" width="165.8" height="17" rx="8" class="chip"/>
<text x="194.6" y="518" class="chipt">rule-diagram-design-k12</text>
<text x="60" y="540" class="lbl" text-anchor="end">33</text>
<text x="120" y="540" class="mono m">"review-design"</text>
<path d="M120 536 h108.0" class="strike"/>
