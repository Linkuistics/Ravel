<svg xmlns="http://www.w3.org/2000/svg" width="1441" height="859" viewBox="0 0 1441 859">
<style>
:root{--bg:#ffffff;--panel:#fbfbfc;--hdr:#f1f3f6;--line:#d5dae2;--t:#1d2330;--m:#677184;
--cur:#0e7c66;--curbg:#e3f4ef;--sel:#d99a00;--e:#b3261e;--ebg:#fdecea;--chip:#eceff4;
--note:#2b3445;--box:#ffffff;--boxl:#5f6878;--gw:#ffffff;--ref:#1f4fa3;--frame:#c9ced8;
--tok:#2f6fd6;--lbl:#f4f5f7;--code:#f4f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#15171c;--panel:#1b1e25;--hdr:#232731;
--line:#363c48;--t:#e5e8ee;--m:#9aa3b3;--cur:#4fd1b5;--curbg:#173a33;--sel:#f2c94c;
--e:#ff7b72;--ebg:#3b1f22;--chip:#2a2f3b;--note:#d5dae3;--box:#1f232b;--boxl:#9aa3b3;
--gw:#1f232b;--ref:#8fb4ff;--frame:#3a404c;--tok:#6ea8ff;--lbl:#232731;--code:#20242c}}
svg{background:var(--bg)}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:var(--t)}
.lab{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:var(--t)}
.labp{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--t)}
.m{fill:var(--m)} .b{font-weight:700} .sm{font-size:11px} .e{fill:var(--e);font-weight:600}
.cur{fill:var(--cur);font-weight:600} .refc{fill:var(--ref);font-weight:600}
.h1{font-size:15px;font-weight:700} .h2{font-size:12px;font-weight:700;fill:var(--m);letter-spacing:.04em}
.panel{fill:var(--panel);stroke:var(--line)} .hdr{fill:var(--hdr)}
.task{fill:var(--box);stroke:var(--boxl);stroke-width:1.4}
.refbox{fill:var(--box);stroke:var(--boxl);stroke-width:3.2}
.gw{fill:var(--gw);stroke:var(--boxl);stroke-width:1.4} .gwx{stroke:var(--boxl);stroke-width:1.8}
.ev{fill:var(--box);stroke:var(--boxl);stroke-width:1.4} .evend{fill:var(--box);stroke:var(--boxl);stroke-width:3.6}
.flow{stroke:var(--boxl);stroke-width:1.4;fill:none}
.ah{fill:var(--boxl)} .drill{fill:var(--box);stroke:var(--boxl);stroke-width:1.2}
.lblbg{fill:var(--bg)} .lbl{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--m)}
.tab{fill:var(--cur);stroke:var(--cur);stroke-width:1.2} .tabo{fill:var(--bg);stroke:var(--cur);stroke-width:1.4}
.tabt{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:700;fill:var(--bg)} .tabto{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:700;fill:var(--cur)}
.nextmark{fill:none;stroke:var(--cur);stroke-width:2} .nextmarko{fill:none;stroke:var(--cur);stroke-width:2;stroke-dasharray:5 3}
.nextbtn{fill:var(--cur)} .nextbtnt{font-size:10px;font-weight:700;fill:var(--bg)}
.passbg{fill:var(--curbg);stroke:var(--cur);stroke-width:1} .passt{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--cur);font-weight:600}
.sel{fill:none;stroke:var(--sel);stroke-width:2.6} .selflow{fill:none;stroke:var(--sel);stroke-width:5;opacity:.55}
.backmark{fill:none;stroke:var(--cur);stroke-width:4;opacity:.45}
.data{fill:var(--box);stroke:var(--boxl);stroke-width:1.2} .assoc{stroke:var(--boxl);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.badge{fill:var(--chip)} .chip{fill:var(--curbg);stroke:var(--cur)} .chipt{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:var(--cur)}
.pop{fill:var(--bg);stroke:var(--line)} .banner{fill:var(--ebg);stroke:var(--e)}
.call{fill:var(--t)} .callt{fill:var(--bg);font-size:11px;font-weight:700}
.note{fill:var(--note)} .nest{fill:none;stroke:var(--m);stroke-width:1;stroke-dasharray:3 3}
.nestt{font-size:10px;fill:var(--m)} .tok{fill:var(--tok)} .tokt{font-size:10px;font-weight:700;fill:#fff}
.code{fill:var(--code);stroke:var(--line)} .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.crumb{fill:var(--ref)} .rejbox{fill:none;stroke:var(--e);stroke-width:2;stroke-dasharray:4 3}
.strike{fill:none;stroke:var(--m);stroke-width:1.3}
.loopbar{fill:none;stroke:var(--cur);stroke-width:2.5;stroke-linecap:round}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<text x="16" y="26" class="h1">Sketch: abandoned work as a withdrawn step</text>
<text x="16" y="46" class="m">A leaf that the human abandoned stays in the sequence as a withdrawn step. The views show it, and the tracer does not read it, so the grammar needs no rule for</text>
<text x="16" y="63" class="m">abandonment. Withdrawn steps wait until after the slice.</text>
<text x="16" y="86" class="b">A real case: one node of the BookScanBuilder grove</text>
<rect x="16" y="108" width="600" height="240" rx="8" class="panel"/>
<text x="28" y="102" class="m sm">Output view, roughly: the node level-music-paper-arms-angular-costs, with its folds open</text>
<text x="60" y="134" class="lbl" text-anchor="end">1</text>
<text x="72" y="134" class="mono">impl · "impl"</text>
<rect x="175.6" y="122" width="152.6" height="17" rx="8" class="chip"/>
<text x="182.6" y="134" class="chipt">stream-inventory-k387</text>
<circle cx="30.0" cy="130.0" r="9" class="call"/>
<text x="30.0" y="134.0" class="callt" text-anchor="middle">1</text>
<text x="60" y="156" class="lbl" text-anchor="end">2</text>
<text x="72" y="156" class="mono">impl · "impl"</text>
<rect x="175.6" y="144" width="126.2" height="17" rx="8" class="chip"/>
<text x="182.6" y="156" class="chipt">availability-k388</text>
<text x="60" y="178" class="lbl" text-anchor="end">3</text>
<text x="72" y="178" class="mono">impl · "impl"</text>
<rect x="175.6" y="166" width="93.2" height="17" rx="8" class="chip"/>
<text x="182.6" y="178" class="chipt">readers-k391</text>
<text x="60" y="200" class="lbl" text-anchor="end">4</text>
<text x="72" y="200" class="mono">impl · "impl"</text>
<rect x="175.6" y="188" width="93.2" height="17" rx="8" class="chip"/>
<text x="182.6" y="200" class="chipt">checker-k392</text>
<text x="60" y="222" class="lbl" text-anchor="end">5</text>
<text x="72" y="222" class="mono m">"impl"</text>
<path d="M72 218 h43.2" class="strike"/>
<rect x="125.2" y="210" width="159.2" height="17" rx="8" class="chip"/>
<text x="132.2" y="222" class="chipt">semantic-controls-k389</text>
<text x="604" y="222" class="cur sm" text-anchor="end">withdrawn</text>
