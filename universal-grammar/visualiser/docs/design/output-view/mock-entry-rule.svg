<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600">
<style>
:root{--bg:#ffffff;--panel:#fbfbfc;--hdr:#f1f3f6;--line:#d5dae2;--t:#1d2330;--m:#677184;
--r:#1f4fa3;--s:#8a4500;--l:#6b3fa0;--fold:#eef0fb;--cur:#0e7c66;--curbg:#e3f4ef;
--sel:#e0a800;--e:#b3261e;--ebg:#fdecea;--chip:#eceff4;--link:#0b5fc0;--note:#2b3445;
--box:#ffffff;--boxl:#8d96a6;--code:#f4f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#15171c;--panel:#1b1e25;--hdr:#232731;
--line:#363c48;--t:#e5e8ee;--m:#9aa3b3;--r:#8fb4ff;--s:#f0b37e;--l:#c9a8f7;--fold:#272b3e;
--cur:#4fd1b5;--curbg:#173a33;--sel:#f2c94c;--e:#ff7b72;--ebg:#3b1f22;--chip:#2a2f3b;
--link:#7cb7ff;--note:#d5dae3;--box:#1f232b;--boxl:#6c7484;--code:#20242c}}
svg{background:var(--bg)}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--t)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.t{fill:var(--t)} .m{fill:var(--m)} .r{fill:var(--r);font-weight:600} .s{fill:var(--s)}
.l{fill:var(--l);font-weight:600} .p{fill:var(--cur);font-weight:600} .e{fill:var(--e);font-weight:600}
.lk{fill:var(--link)} .b{font-weight:700} .i{font-style:italic} .sm{font-size:11px}
.h1{font-size:15px;font-weight:700} .h2{font-size:12px;font-weight:700;fill:var(--m);letter-spacing:.04em}
.panel{fill:var(--panel);stroke:var(--line)} .hdr{fill:var(--hdr)} .rule{stroke:var(--line)}
.fold{fill:var(--fold)} .curbar{fill:var(--cur)} .curbg{fill:var(--curbg)} .errbg{fill:var(--ebg)}
.sel{fill:none;stroke:var(--sel);stroke-width:2.5} .chip{fill:var(--chip)}
.next{fill:var(--curbg);stroke:var(--cur)} .nexto{fill:none;stroke:var(--m);stroke-dasharray:3 3}
.tw{fill:var(--m)} .call{fill:var(--t)} .callt{fill:var(--bg);font-size:11px;font-weight:700}
.note{fill:var(--note)} .code{fill:var(--code);stroke:var(--line)}
.box{fill:var(--box);stroke:var(--boxl);stroke-width:1.3} .flow{stroke:var(--boxl);stroke-width:1.3;fill:none}
.back{stroke:var(--boxl);stroke-width:1.3;fill:none;stroke-dasharray:5 3}
.marker{fill:var(--cur)} .nextmark{fill:none;stroke:var(--cur);stroke-width:2;stroke-dasharray:5 3}
.ah{fill:var(--boxl)} .data{fill:var(--box);stroke:var(--boxl);stroke-width:1.2}
.assoc{stroke:var(--boxl);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.btn{fill:var(--hdr);stroke:var(--line)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<text x="24.0" y="32.0" class="h1" text-anchor="start" xml:space="preserve">Where a pass starts in a loop through several rules</text>
<text x="24.0" y="52.0" class="m" text-anchor="start" xml:space="preserve">Agreed. Six steps of an invented interview grammar, drawn by each rule for passes.</text>
<rect x="24.0" y="58.0" width="1192.0" height="81.0" rx="6" class="code"/>
<text x="36.0" y="77.0" class="h2" text-anchor="start" xml:space="preserve">GRAMMAR   ·   SEQUENCE: OPENS ASKS ANSWERS ASKS ANSWERS ASKS</text>
<text x="36.0" y="98.0" class="mono" text-anchor="start" xml:space="preserve">dialogue = "opens" question | "resumes" answer ;</text>
<text x="36.0" y="115.0" class="mono" text-anchor="start" xml:space="preserve">question = "asks" answer ;</text>
<text x="36.0" y="132.0" class="mono" text-anchor="start" xml:space="preserve">answer   = "answers" question? ;        // question and answer form a loop of tail references</text>
<rect x="24.0" y="160.0" width="580.0" height="38.0" rx="0" class="hdr"/>
<text x="36.0" y="184.0" class="b" text-anchor="start" xml:space="preserve">Agreed: each pass starts at the pass rule</text>
<rect x="80.0" y="204.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="221.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M90 213 L99 213 L94.5 218.5z" class="tw"/>
<text x="104.0" y="221.0" xml:space="preserve"><tspan class="r">dialogue</tspan></text>
<text x="72.0" y="247.0" class="m mono sm" text-anchor="end" xml:space="preserve">1</text>
<text x="108.0" y="247.0" xml:space="preserve"><tspan class="s mono">"opens"</tspan></text>
<rect x="80.0" y="256.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="273.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M108 265 L117 265 L112.5 270.5z" class="tw"/>
<text x="122.0" y="273.0" xml:space="preserve"><tspan class="l">question ↻</tspan><tspan class="m">  entered at question</tspan></text>
<text x="570.0" y="273.0" class="m sm" text-anchor="end" xml:space="preserve">pass 3</text>
<rect x="122.0" y="284.0" width="474.0" height="22.0" rx="5" class="fold"/>
<text x="72.0" y="299.0" class="m mono sm" text-anchor="end" xml:space="preserve">2–5</text>
<path d="M127 289 L132.5 293.5 L127 298z" class="tw"/>
<text x="140.0" y="299.0" xml:space="preserve"><tspan class="p">completed</tspan><tspan class="m">  ·  </tspan><tspan class="m">2 passes  ·  4 steps</tspan></text>
<rect x="80.0" y="308.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="325.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M126 317 L135 317 L130.5 322.5z" class="tw"/>
<text x="140.0" y="325.0" xml:space="preserve"><tspan class="p">pass 3</tspan><tspan class="m">  ·  </tspan><tspan class="r">question</tspan></text>
<rect x="140.0" y="336.0" width="456.0" height="22.0" rx="5" class="curbg"/>
<rect x="80.0" y="334.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="351.0" class="m mono sm" text-anchor="end" xml:space="preserve">6</text>
<text x="144.0" y="351.0" xml:space="preserve"><tspan class="s mono">"asks"</tspan></text>
<line x1="32.0" y1="362.0" x2="596.0" y2="362.0" class="rule"/>
<text x="72.0" y="379.0" class="m mono sm" text-anchor="end" xml:space="preserve">7</text>
<text x="88.0" y="379.0" xml:space="preserve"><tspan class="m">next</tspan></text>
<rect x="124.4" y="366.0" width="81.2" height="20.0" rx="10" class="next"/>
<text x="132.4" y="380.0" class="s mono" text-anchor="start" xml:space="preserve">"answers"</text>
<rect x="24" y="160" width="580" height="232.0" rx="6" style="fill:none;stroke:var(--line)"/>
<circle cx="588.0" cy="269.0" r="9" class="call"/>
<text x="588.0" y="273.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<circle cx="588.0" cy="295.0" r="9" class="call"/>
<text x="588.0" y="299.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<rect x="636.0" y="160.0" width="580.0" height="38.0" rx="0" class="hdr"/>
<text x="648.0" y="184.0" class="b" text-anchor="start" xml:space="preserve">Rejected: every tail call starts a pass</text>
<rect x="692.0" y="204.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="684.0" y="221.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M702 213 L711 213 L706.5 218.5z" class="tw"/>
<text x="716.0" y="221.0" xml:space="preserve"><tspan class="r">dialogue</tspan></text>
<text x="684.0" y="247.0" class="m mono sm" text-anchor="end" xml:space="preserve">1</text>
<text x="720.0" y="247.0" xml:space="preserve"><tspan class="s mono">"opens"</tspan></text>
<rect x="692.0" y="256.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="684.0" y="273.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M720 265 L729 265 L724.5 270.5z" class="tw"/>
<text x="734.0" y="273.0" xml:space="preserve"><tspan class="l">question ↻ answer</tspan></text>
<text x="1204.0" y="273.0" class="m sm" text-anchor="end" xml:space="preserve">pass 5</text>
<rect x="734.0" y="284.0" width="474.0" height="22.0" rx="5" class="fold"/>
<text x="684.0" y="299.0" class="m mono sm" text-anchor="end" xml:space="preserve">2–5</text>
<path d="M739 289 L744.5 293.5 L739 298z" class="tw"/>
<text x="752.0" y="299.0" xml:space="preserve"><tspan class="p">completed</tspan><tspan class="m">  ·  </tspan><tspan class="m">4 passes  ·  4 steps</tspan></text>
<rect x="692.0" y="308.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="684.0" y="325.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M738 317 L747 317 L742.5 322.5z" class="tw"/>
<text x="752.0" y="325.0" xml:space="preserve"><tspan class="p">pass 5</tspan><tspan class="m">  ·  </tspan><tspan class="r">question</tspan></text>
<rect x="752.0" y="336.0" width="456.0" height="22.0" rx="5" class="curbg"/>
<rect x="692.0" y="334.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="684.0" y="351.0" class="m mono sm" text-anchor="end" xml:space="preserve">6</text>
<text x="756.0" y="351.0" xml:space="preserve"><tspan class="s mono">"asks"</tspan></text>
<line x1="644.0" y1="362.0" x2="1208.0" y2="362.0" class="rule"/>
<text x="684.0" y="379.0" class="m mono sm" text-anchor="end" xml:space="preserve">7</text>
<text x="700.0" y="379.0" xml:space="preserve"><tspan class="m">next</tspan></text>
<rect x="736.4" y="366.0" width="81.2" height="20.0" rx="10" class="next"/>
<text x="744.4" y="380.0" class="s mono" text-anchor="start" xml:space="preserve">"answers"</text>
<rect x="636" y="160" width="580" height="232.0" rx="6" style="fill:none;stroke:var(--line)"/>
<circle cx="1200.0" cy="295.0" r="9" class="call"/>
<text x="1200.0" y="299.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<text x="24.0" y="426.0" class="h2" text-anchor="start" xml:space="preserve">READING THE MOCK-UP</text>
<circle cx="33.0" cy="444.0" r="9" class="call"/>
<text x="33.0" y="448.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<text x="50.0" y="448.0" class="note" text-anchor="start" xml:space="preserve">The reading entered the loop at question, from dialogue, so question is the pass rule. Each pass starts at a tail reference to it.</text>
<circle cx="33.0" cy="471.0" r="9" class="call"/>
<text x="33.0" y="475.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<text x="50.0" y="475.0" class="note" text-anchor="start" xml:space="preserve">One pass is one trip around the loop: "asks" then "answers". The count matches the repetition ("asks" "answers")+ that the loop is equal to.</text>
<circle cx="33.0" cy="498.0" r="9" class="call"/>
<text x="33.0" y="502.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<text x="50.0" y="502.0" class="note" text-anchor="start" xml:space="preserve">If every tail call starts a pass, passes alternate between question and answer, and the count doubles. A pass no longer means one trip.</text>
</svg>
