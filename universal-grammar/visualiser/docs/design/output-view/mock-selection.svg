<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
<style>
:root{--bg:#ffffff;--panel:#fbfbfc;--hdr:#f1f3f6;--line:#d5dae2;--t:#1d2330;--m:#677184;
--r:#1f4fa3;--s:#8a4500;--l:#6b3fa0;--fold:#eef0fb;--cur:#0e7c66;--curbg:#e3f4ef;
--sel:#e0a800;--e:#b3261e;--ebg:#fdecea;--chip:#eceff4;--link:#0b5fc0;--note:#2b3445;
--box:#ffffff;--boxl:#8d96a6;--code:#f4f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#15171c;--panel:#1b1e25;--hdr:#232731;
--line:#363c48;--t:#e5e8ee;--m:#9aa3b3;--r:#8fb4ff;--s:#f0b37e;--l:#c9a8f7;--fold:#272b3e;
--cur:#4fd1b5;--curbg:#173a33;--sel:#f2c94c;--e:#ff7b72;--ebg:#3b1f22;--chip:#2a2f3b;
--link:#7cb7ff;--note:#d5dae3;--box:#1f232b;--boxl:#6c7484;--code:#20242c}}
svg{background:var(--bg)}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--t)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.t{fill:var(--t)} .m{fill:var(--m)} .r{fill:var(--r);font-weight:600} .s{fill:var(--s)}
.l{fill:var(--l);font-weight:600} .p{fill:var(--cur);font-weight:600} .e{fill:var(--e);font-weight:600}
.lk{fill:var(--link)} .b{font-weight:700} .i{font-style:italic} .sm{font-size:11px}
.h1{font-size:15px;font-weight:700} .h2{font-size:12px;font-weight:700;fill:var(--m);letter-spacing:.04em}
.panel{fill:var(--panel);stroke:var(--line)} .hdr{fill:var(--hdr)} .rule{stroke:var(--line)}
.fold{fill:var(--fold)} .curbar{fill:var(--cur)} .curbg{fill:var(--curbg)} .errbg{fill:var(--ebg)}
.sel{fill:none;stroke:var(--sel);stroke-width:2.5} .chip{fill:var(--chip)}
.next{fill:var(--curbg);stroke:var(--cur)} .nexto{fill:none;stroke:var(--m);stroke-dasharray:3 3}
.tw{fill:var(--m)} .call{fill:var(--t)} .callt{fill:var(--bg);font-size:11px;font-weight:700}
.note{fill:var(--note)} .code{fill:var(--code);stroke:var(--line)}
.box{fill:var(--box);stroke:var(--boxl);stroke-width:1.3} .flow{stroke:var(--boxl);stroke-width:1.3;fill:none}
.back{stroke:var(--boxl);stroke-width:1.3;fill:none;stroke-dasharray:5 3}
.marker{fill:var(--cur)} .nextmark{fill:none;stroke:var(--cur);stroke-width:2;stroke-dasharray:5 3}
.ah{fill:var(--boxl)} .data{fill:var(--box);stroke:var(--boxl);stroke-width:1.2}
.assoc{stroke:var(--boxl);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.btn{fill:var(--hdr);stroke:var(--line)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<text x="24.0" y="32.0" class="h1" text-anchor="start" xml:space="preserve">A selected step in the URG move grammar, in both views</text>
<text x="24.0" y="52.0" class="m" text-anchor="start" xml:space="preserve">Agreed. Seven steps so far. The person selects step 6 "identifies a gap", in pass 2 of a self tail call.</text>
<rect x="24.0" y="70.0" width="600.0" height="38.0" rx="0" class="hdr"/>
<text x="36.0" y="94.0" class="b" text-anchor="start" xml:space="preserve">Output view</text>
<rect x="134.3" y="79.0" width="22.0" height="20.0" rx="4" class="btn"/>
<text x="145.3" y="94.0" class="m b" text-anchor="middle" xml:space="preserve">‹</text>
<rect x="160.3" y="79.0" width="22.0" height="20.0" rx="4" class="btn"/>
<text x="171.3" y="94.0" class="m b" text-anchor="middle" xml:space="preserve">›</text>
<text x="190.3" y="94.0" class="t" text-anchor="start" xml:space="preserve">Reading 1 of 1</text>
<text x="612.0" y="94.0" class="m sm" text-anchor="end" xml:space="preserve">7 steps  ·  can end here</text>
<rect x="80.0" y="114.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="131.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M90 123 L99 123 L94.5 128.5z" class="tw"/>
<text x="104.0" y="131.0" xml:space="preserve"><tspan class="r">episode</tspan></text>
<text x="72.0" y="157.0" class="m mono sm" text-anchor="end" xml:space="preserve">1</text>
<text x="108.0" y="157.0" xml:space="preserve"><tspan class="s mono">"refers back"</tspan></text>
<text x="72.0" y="183.0" class="m mono sm" text-anchor="end" xml:space="preserve">2</text>
<text x="108.0" y="183.0" xml:space="preserve"><tspan class="s mono">"states the problem"</tspan></text>
<rect x="80.0" y="192.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="209.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M108 201 L117 201 L112.5 206.5z" class="tw"/>
<text x="122.0" y="209.0" xml:space="preserve"><tspan class="r">development</tspan></text>
<text x="72.0" y="235.0" class="m mono sm" text-anchor="end" xml:space="preserve">3</text>
<text x="126.0" y="235.0" xml:space="preserve"><tspan class="s mono">"proposes a solution"</tspan></text>
<rect x="80.0" y="244.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="261.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M126 253 L135 253 L130.5 258.5z" class="tw"/>
<text x="140.0" y="261.0" xml:space="preserve"><tspan class="l">refinement ↻</tspan><tspan class="m">  self tail call</tspan></text>
<text x="590.0" y="261.0" class="m sm" text-anchor="end" xml:space="preserve">pass 2</text>
<rect x="140.0" y="272.0" width="476.0" height="22.0" rx="5" class="fold"/>
<text x="72.0" y="287.0" class="m mono sm" text-anchor="end" xml:space="preserve">4–5</text>
<path d="M145 277 L150.5 281.5 L145 286z" class="tw"/>
<text x="158.0" y="287.0" xml:space="preserve"><tspan class="p">completed</tspan><tspan class="m">  ·  </tspan><tspan class="m">1 pass  ·  2 steps</tspan></text>
<rect x="80.0" y="296.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="313.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M144 305 L153 305 L148.5 310.5z" class="tw"/>
<text x="158.0" y="313.0" xml:space="preserve"><tspan class="p">pass 2</tspan><tspan class="m">  ·  </tspan><tspan class="r">refinement</tspan></text>
<rect x="156.0" y="323.0" width="460.0" height="24.0" rx="6" class="sel"/>
<text x="72.0" y="339.0" class="m mono sm" text-anchor="end" xml:space="preserve">6</text>
<text x="162.0" y="339.0" xml:space="preserve"><tspan class="s mono">"identifies a gap"</tspan></text>
<rect x="158.0" y="350.0" width="458.0" height="22.0" rx="5" class="curbg"/>
<rect x="80.0" y="348.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="365.0" class="m mono sm" text-anchor="end" xml:space="preserve">7</text>
<text x="162.0" y="365.0" xml:space="preserve"><tspan class="s mono">"revises the solution"</tspan></text>
<line x1="32.0" y1="376.0" x2="616.0" y2="376.0" class="rule"/>
<text x="72.0" y="393.0" class="m mono sm" text-anchor="end" xml:space="preserve">8</text>
<text x="88.0" y="393.0" xml:space="preserve"><tspan class="m">next</tspan></text>
<rect x="124.4" y="380.0" width="146.5" height="20.0" rx="10" class="next"/>
<text x="132.4" y="394.0" class="s mono" text-anchor="start" xml:space="preserve">"identifies a gap"</text>
<rect x="276.9" y="380.0" width="146.5" height="20.0" rx="10" class="next"/>
<text x="284.9" y="394.0" class="s mono" text-anchor="start" xml:space="preserve">"gives an example"</text>
<text x="433.4" y="393.0" class="m sm" text-anchor="start" xml:space="preserve">or end here</text>
<rect x="24" y="70" width="600" height="336.0" rx="6" style="fill:none;stroke:var(--line)"/>
<circle cx="608.0" cy="257.0" r="9" class="call"/>
<text x="608.0" y="261.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<circle cx="608.0" cy="335.0" r="9" class="call"/>
<text x="608.0" y="339.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<rect x="652.0" y="70.0" width="564.0" height="300.0" rx="6" class="panel"/>
<rect x="652.0" y="70.0" width="564.0" height="38.0" rx="0" class="hdr"/>
<text x="664.0" y="94.0" class="b" text-anchor="start" xml:space="preserve">Grammar view</text>
<text x="772.0" y="94.0" class="m" text-anchor="start" xml:space="preserve">episode › development › refinement (pass 2)</text>
<text x="1204.0" y="360.0" class="m sm i" text-anchor="end" xml:space="preserve">sketch: the rule-diagram design sets the drawing</text>
<circle cx="1069.8" cy="89.0" r="9" class="call"/>
<text x="1069.8" y="93.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<circle cx="682" cy="230" r="9" class="box"/>
<path d="M691.0 230.0 L718.0 230.0" class="flow" marker-end="url(#ah)"/>
<rect x="720.0" y="210.0" width="150.0" height="40.0" rx="7" class="box"/>
<text x="795.0" y="235.0" class="s mono" text-anchor="middle" xml:space="preserve">identifies a gap</text>
<rect x="715.0" y="205.0" width="160.0" height="50.0" rx="9" class="sel"/>
<circle cx="795.0" cy="188.0" r="9" class="call"/>
<text x="795.0" y="192.0" class="callt" text-anchor="middle" xml:space="preserve">4</text>
<path d="M870.0 230.0 L896.0 230.0" class="flow" marker-end="url(#ah)"/>
<rect x="898.0" y="210.0" width="170.0" height="40.0" rx="7" class="box"/>
<text x="983.0" y="235.0" class="s mono" text-anchor="middle" xml:space="preserve">revises the solution</text>
<path d="M976 196 L990 196 L990 204 L983 209 L976 204z" class="marker"/>
<path d="M1068.0 230.0 L1100.0 230.0" class="flow" marker-end="url(#ah)"/>
<path d="M1114 216 L1128 230 L1114 244 L1100 230z" class="box"/>
<text x="1114.0" y="234.0" class="m b" text-anchor="middle" xml:space="preserve">×</text>
<path d="M1128.0 230.0 L1172.0 230.0" class="flow" marker-end="url(#ah)"/>
<circle cx="1182" cy="230" r="9" class="box" style="stroke-width:3.2"/>
<path d="M1114 244 L1114 294 L704 294 L704 238" class="back" marker-end="url(#ah)"/>
<text x="909.0" y="312.0" class="m sm" text-anchor="middle" xml:space="preserve">refinement: self tail call, a new pass</text>
<circle cx="1122.0" cy="294.0" r="9" class="call"/>
<text x="1122.0" y="298.0" class="callt" text-anchor="middle" xml:space="preserve">5</text>
<text x="668.0" y="332.0" class="m sm" text-anchor="start" xml:space="preserve">Teal chevron: the reading marker after step 7.  Yellow outline: the selection.</text>
<text x="24.0" y="436.0" class="h2" text-anchor="start" xml:space="preserve">READING THE MOCK-UP</text>
<circle cx="33.0" cy="454.0" r="9" class="call"/>
<text x="33.0" y="458.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<text x="50.0" y="458.0" class="note" text-anchor="start" xml:space="preserve">The person selects the row of step 6. The selection outline is yellow, and the teal marks of the run stay as they are.</text>
<circle cx="33.0" cy="481.0" r="9" class="call"/>
<text x="33.0" y="485.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<text x="50.0" y="485.0" class="note" text-anchor="start" xml:space="preserve">The loop row of a self tail call names the rule with ↻. Each pass is one node of the rule.</text>
<circle cx="33.0" cy="508.0" r="9" class="call"/>
<text x="33.0" y="512.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<text x="50.0" y="512.0" class="note" text-anchor="start" xml:space="preserve">The grammar view opens the diagram that holds the element. Its open path follows the ancestors of the node, so it shows only the current pass.</text>
<circle cx="33.0" cy="535.0" r="9" class="call"/>
<text x="33.0" y="539.0" class="callt" text-anchor="middle" xml:space="preserve">4</text>
<text x="50.0" y="539.0" class="note" text-anchor="start" xml:space="preserve">The task box of the symbol occurrence that step 6 matched gets the same yellow outline.</text>
<circle cx="33.0" cy="562.0" r="9" class="call"/>
<text x="33.0" y="566.0" class="callt" text-anchor="middle" xml:space="preserve">5</text>
<text x="50.0" y="566.0" class="note" text-anchor="start" xml:space="preserve">A selection of the back edge in the grammar view selects the pass rows that the tail call started.</text>
</svg>
