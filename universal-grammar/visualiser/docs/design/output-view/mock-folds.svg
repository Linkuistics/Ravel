<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="558" viewBox="0 0 1240 558">
<style>
:root{--bg:#ffffff;--panel:#fbfbfc;--hdr:#f1f3f6;--line:#d5dae2;--t:#1d2330;--m:#677184;
--r:#1f4fa3;--s:#8a4500;--l:#6b3fa0;--fold:#eef0fb;--cur:#0e7c66;--curbg:#e3f4ef;
--sel:#e0a800;--e:#b3261e;--ebg:#fdecea;--chip:#eceff4;--link:#0b5fc0;--note:#2b3445;
--box:#ffffff;--boxl:#8d96a6;--code:#f4f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#15171c;--panel:#1b1e25;--hdr:#232731;
--line:#363c48;--t:#e5e8ee;--m:#9aa3b3;--r:#8fb4ff;--s:#f0b37e;--l:#c9a8f7;--fold:#272b3e;
--cur:#4fd1b5;--curbg:#173a33;--sel:#f2c94c;--e:#ff7b72;--ebg:#3b1f22;--chip:#2a2f3b;
--link:#7cb7ff;--note:#d5dae3;--box:#1f232b;--boxl:#6c7484;--code:#20242c}}
svg{background:var(--bg)}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--t)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.t{fill:var(--t)} .m{fill:var(--m)} .r{fill:var(--r);font-weight:600} .s{fill:var(--s)}
.l{fill:var(--l);font-weight:600} .p{fill:var(--cur);font-weight:600} .e{fill:var(--e);font-weight:600}
.lk{fill:var(--link)} .b{font-weight:700} .i{font-style:italic} .sm{font-size:11px}
.h1{font-size:15px;font-weight:700} .h2{font-size:12px;font-weight:700;fill:var(--m);letter-spacing:.04em}
.panel{fill:var(--panel);stroke:var(--line)} .hdr{fill:var(--hdr)} .rule{stroke:var(--line)}
.fold{fill:var(--fold)} .curbar{fill:var(--cur)} .curbg{fill:var(--curbg)} .errbg{fill:var(--ebg)}
.sel{fill:none;stroke:var(--sel);stroke-width:2.5} .chip{fill:var(--chip)}
.next{fill:var(--curbg);stroke:var(--cur)} .nexto{fill:none;stroke:var(--m);stroke-dasharray:3 3}
.tw{fill:var(--m)} .call{fill:var(--t)} .callt{fill:var(--bg);font-size:11px;font-weight:700}
.note{fill:var(--note)} .code{fill:var(--code);stroke:var(--line)}
.box{fill:var(--box);stroke:var(--boxl);stroke-width:1.3} .flow{stroke:var(--boxl);stroke-width:1.3;fill:none}
.back{stroke:var(--boxl);stroke-width:1.3;fill:none;stroke-dasharray:5 3}
.marker{fill:var(--cur)} .nextmark{fill:none;stroke:var(--cur);stroke-width:2;stroke-dasharray:5 3}
.ah{fill:var(--boxl)} .data{fill:var(--box);stroke:var(--boxl);stroke-width:1.2}
.assoc{stroke:var(--boxl);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.btn{fill:var(--hdr);stroke:var(--line)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<text x="24.0" y="32.0" class="h1" text-anchor="start" xml:space="preserve">A fold opens on a click, and stays open while the run goes on</text>
<text x="24.0" y="52.0" class="m" text-anchor="start" xml:space="preserve">Agreed. The same state as the anatomy view, with the lesson+ fold open.</text>
<rect x="24.0" y="70.0" width="580.0" height="38.0" rx="0" class="hdr"/>
<text x="36.0" y="94.0" class="b" text-anchor="start" xml:space="preserve">Folded (the rule)</text>
<rect x="80.0" y="114.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="131.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M108 123 L117 123 L112.5 128.5z" class="tw"/>
<text x="122.0" y="131.0" xml:space="preserve"><tspan class="l">lesson+</tspan></text>
<text x="592.0" y="131.0" class="m sm" text-anchor="end" xml:space="preserve">pass 2</text>
<rect x="122.0" y="142.0" width="474.0" height="22.0" rx="5" class="fold"/>
<rect x="120.0" y="141.0" width="476.0" height="24.0" rx="6" class="sel"/>
<text x="72.0" y="157.0" class="m mono sm" text-anchor="end" xml:space="preserve">5–12</text>
<path d="M127 147 L132.5 151.5 L127 156z" class="tw"/>
<text x="140.0" y="157.0" xml:space="preserve"><tspan class="p">completed</tspan><tspan class="m">  ·  </tspan><tspan class="m">1 pass  ·  8 steps  ·  1 file</tspan></text>
<rect x="80.0" y="166.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="72.0" y="183.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M126 175 L135 175 L130.5 180.5z" class="tw"/>
<text x="140.0" y="183.0" xml:space="preserve"><tspan class="p">pass 2</tspan><tspan class="m">  ·  </tspan><tspan class="r">lesson</tspan></text>
<text x="72.0" y="209.0" class="m mono sm" text-anchor="end" xml:space="preserve">13</text>
<text x="144.0" y="209.0" xml:space="preserve"><tspan class="r">introduce_concept</tspan><tspan class="m">  ·  </tspan><tspan class="s mono">"introduce_concept"</tspan></text>
<text x="72.0" y="235.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<text x="144.0" y="235.0" xml:space="preserve"><tspan class="m">…</tspan></text>
<rect x="24" y="70" width="580" height="174.0" rx="6" style="fill:none;stroke:var(--line)"/>
<circle cx="588.0" cy="153.0" r="9" class="call"/>
<text x="588.0" y="157.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<rect x="636.0" y="70.0" width="580.0" height="38.0" rx="0" class="hdr"/>
<text x="648.0" y="94.0" class="b" text-anchor="start" xml:space="preserve">Open (after a click)</text>
<rect x="692.0" y="114.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="684.0" y="131.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M720 123 L729 123 L724.5 128.5z" class="tw"/>
<text x="734.0" y="131.0" xml:space="preserve"><tspan class="l">lesson+</tspan></text>
<text x="1204.0" y="131.0" class="m sm" text-anchor="end" xml:space="preserve">pass 2</text>
<rect x="734.0" y="142.0" width="474.0" height="22.0" rx="5" class="fold"/>
<text x="684.0" y="157.0" class="m mono sm" text-anchor="end" xml:space="preserve">5–12</text>
<path d="M738 149 L747 149 L742.5 154.5z" class="tw"/>
<text x="752.0" y="157.0" xml:space="preserve"><tspan class="p">completed</tspan><tspan class="m">  ·  </tspan><tspan class="m">1 pass  ·  8 steps  ·  open, a click folds it</tspan></text>
<text x="684.0" y="183.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M756 175 L765 175 L760.5 180.5z" class="tw"/>
<text x="770.0" y="183.0" xml:space="preserve"><tspan class="p">pass 1</tspan><tspan class="m">  ·  </tspan><tspan class="r">lesson</tspan></text>
<text x="684.0" y="209.0" class="m mono sm" text-anchor="end" xml:space="preserve">5</text>
<text x="774.0" y="209.0" xml:space="preserve"><tspan class="r">introduce_concept</tspan><tspan class="m">  ·  </tspan><tspan class="s mono">"introduce_concept"</tspan></text>
<rect x="770.0" y="220.0" width="438.0" height="22.0" rx="5" class="fold"/>
<text x="684.0" y="235.0" class="m mono sm" text-anchor="end" xml:space="preserve">6–7</text>
<path d="M775 225 L780.5 229.5 L775 234z" class="tw"/>
<text x="788.0" y="235.0" xml:space="preserve"><tspan class="l">show_example{1,3}</tspan><tspan class="m">  ·  </tspan><tspan class="m">2 passes  ·  2 steps</tspan></text>
<rect x="770.0" y="246.0" width="438.0" height="22.0" rx="5" class="fold"/>
<text x="684.0" y="261.0" class="m mono sm" text-anchor="end" xml:space="preserve">8–11</text>
<path d="M775 251 L780.5 255.5 L775 260z" class="tw"/>
<text x="788.0" y="261.0" xml:space="preserve"><tspan class="l">practice*</tspan><tspan class="m">  ·  </tspan><tspan class="m">1 pass  ·  4 steps  ·  1 file</tspan></text>
<text x="684.0" y="287.0" class="m mono sm" text-anchor="end" xml:space="preserve">12</text>
<text x="774.0" y="287.0" xml:space="preserve"><tspan class="r">check_understanding</tspan><tspan class="m">  ·  </tspan><tspan class="s mono">"check_understanding"</tspan></text>
<rect x="692.0" y="296.0" width="3.0" height="26.0" rx="0" class="curbar"/>
<text x="684.0" y="313.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<path d="M738 305 L747 305 L742.5 310.5z" class="tw"/>
<text x="752.0" y="313.0" xml:space="preserve"><tspan class="p">pass 2</tspan><tspan class="m">  ·  </tspan><tspan class="r">lesson</tspan></text>
<text x="684.0" y="339.0" class="m mono sm" text-anchor="end" xml:space="preserve">13</text>
<text x="756.0" y="339.0" xml:space="preserve"><tspan class="r">introduce_concept</tspan><tspan class="m">  ·  </tspan><tspan class="s mono">"introduce_concept"</tspan></text>
<text x="684.0" y="365.0" class="m mono sm" text-anchor="end" xml:space="preserve"></text>
<text x="756.0" y="365.0" xml:space="preserve"><tspan class="m">…</tspan></text>
<rect x="636" y="70" width="580" height="304.0" rx="6" style="fill:none;stroke:var(--line)"/>
<circle cx="1200.0" cy="153.0" r="9" class="call"/>
<text x="1200.0" y="157.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<circle cx="1200.0" cy="231.0" r="9" class="call"/>
<text x="1200.0" y="235.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<circle cx="1200.0" cy="309.0" r="9" class="call"/>
<text x="1200.0" y="313.0" class="callt" text-anchor="middle" xml:space="preserve">4</text>
<text x="24.0" y="408.0" class="h2" text-anchor="start" xml:space="preserve">READING THE MOCK-UP</text>
<circle cx="33.0" cy="426.0" r="9" class="call"/>
<text x="33.0" y="430.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<text x="50.0" y="430.0" class="note" text-anchor="start" xml:space="preserve">Every completed pass folds by the same fixed rule. The fold never depends on the distance from the last step.</text>
<circle cx="33.0" cy="453.0" r="9" class="call"/>
<text x="33.0" y="457.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<text x="50.0" y="457.0" class="note" text-anchor="start" xml:space="preserve">A click opens the fold. It stays open while the run goes on and new passes join it, until the person folds it again.</text>
<circle cx="33.0" cy="480.0" r="9" class="call"/>
<text x="33.0" y="484.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<text x="50.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">Inside an open fold, each completed pass shows its own content. Its loops fold by the same rule.</text>
<circle cx="33.0" cy="507.0" r="9" class="call"/>
<text x="33.0" y="511.0" class="callt" text-anchor="middle" xml:space="preserve">4</text>
<text x="50.0" y="511.0" class="note" text-anchor="start" xml:space="preserve">The current pass is never folded. A new pass folds the pass before it into the fold row above.</text>
</svg>
