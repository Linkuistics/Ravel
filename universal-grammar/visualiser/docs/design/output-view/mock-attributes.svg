<text x="652.0" y="340.0" class="h2" text-anchor="start" xml:space="preserve">READING THE MOCK-UP</text>
<circle cx="661.0" cy="358.0" r="9" class="call"/>
<text x="661.0" y="362.0" class="callt" text-anchor="middle" xml:space="preserve">1</text>
<text x="678.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">A web address shows its host and path. A click opens it in a new tab.</text>
<circle cx="661.0" cy="385.0" r="9" class="call"/>
<text x="661.0" y="389.0" class="callt" text-anchor="middle" xml:space="preserve">2</text>
<text x="678.0" y="389.0" class="note" text-anchor="start" xml:space="preserve">A relative file reference shows its path. Other attributes follow as key=value chips</text>
<text x="678.0" y="406.0" class="note" text-anchor="start" xml:space="preserve">while they fit, and "+2" counts the rest.</text>
<circle cx="661.0" cy="429.0" r="9" class="call"/>
<text x="661.0" y="433.0" class="callt" text-anchor="middle" xml:space="preserve">3</text>
<text x="678.0" y="433.0" class="note" text-anchor="start" xml:space="preserve">Before any folder is open, the page cannot read the file. The panel offers the folder</text>
<text x="678.0" y="450.0" class="note" text-anchor="start" xml:space="preserve">picker.</text>
<circle cx="661.0" cy="473.0" r="9" class="call"/>
<text x="661.0" y="477.0" class="callt" text-anchor="middle" xml:space="preserve">4</text>
<text x="678.0" y="477.0" class="note" text-anchor="start" xml:space="preserve">After the person opens the folder of the trace file, the page resolves each relative</text>
<text x="678.0" y="494.0" class="note" text-anchor="start" xml:space="preserve">reference against it.</text>
<circle cx="661.0" cy="517.0" r="9" class="call"/>
<text x="661.0" y="521.0" class="callt" text-anchor="middle" xml:space="preserve">5</text>
<text x="678.0" y="521.0" class="note" text-anchor="start" xml:space="preserve">Other forms stay text, and the page never runs a value as a script.</text>
<circle cx="661.0" cy="544.0" r="9" class="call"/>
<text x="661.0" y="548.0" class="callt" text-anchor="middle" xml:space="preserve">6</text>
<text x="678.0" y="548.0" class="note" text-anchor="start" xml:space="preserve">The grammar view draws a data object beside the task box of the step in focus, with</text>
<text x="678.0" y="565.0" class="note" text-anchor="start" xml:space="preserve">the attribute count. It never moves a box.</text>
