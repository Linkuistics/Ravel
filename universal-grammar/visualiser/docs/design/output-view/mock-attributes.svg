<text x="648.0" y="298.0" class="m sm" text-anchor="start" xml:space="preserve">solution: a path that starts with / stays text. The page opens only</text>
<text x="648.0" y="314.0" class="m sm" text-anchor="start" xml:space="preserve">web addresses and paths relative to the opened folder.</text>
<circle cx="1200.0" cy="302.0" r="9" class="call"/>
