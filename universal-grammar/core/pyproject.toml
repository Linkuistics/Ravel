[project]
name = "urg"
version = "0.1.0"
description = "Universal Refinement Grammar: evidence-first analysis of a personal research library"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Antony Blakey" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pymupdf>=1.24",
]

[project.scripts]
urg = "urg.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["urg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["urg", "tests"]
venvPath = "."
venv = ".venv"
