# Verified with cargo-release 1.1.2, using isolated dry/config fixtures.
# https://github.com/crate-ci/cargo-release/blob/v1.1.2/docs/reference.md
publish = false
push = false
allow-branch = ["*", "HEAD"]
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
consolidate-commits = true
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "^## Unreleased$", replace = "## Unreleased\n\n## v{{version}}", exactly = 1 },
  # The book's one version line (chapter 3). It holds the placeholder until the
  # first release and the previous version afterwards, so the next cut finds it.
  # scripts/release-book-version.sh checks the result before anything publishes.
  { file = "../../docs/book/src/03-a-complete-session.md", search = "^ravel (@RAVEL_BOOK_VERSION@|[0-9]+\\.[0-9]+\\.[0-9]+)$", replace = "ravel {{version}}", exactly = 1 },
]
