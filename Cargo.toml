# Ravel owns this runner copy; there are no cross-project path dependencies.
[workspace]
members = ["crates/keyed-launch", "crates/ravel"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/Ravel"
# The newest stable release when the configuration design was written.
# rust-toolchain.toml names the same release.
rust-version = "1.99.1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
unfulfilled_lint_expectations = "deny"

# The operations bound is 100,000,000, and the hostile-script tests run an endless
# loop to it. Unoptimised Rhai needs about fifteen seconds for that, so the test
# builds optimise the engine. Debug assertions stay on, as in every dev build.
[profile.dev.package.rhai]
opt-level = 3

# The byte-bound tests of skill resolution capture up to 512 MiB, and each
# byte is hashed at least twice. Unoptimised SHA-256 needs about nine seconds
# for 128 MiB, so the test builds optimise the hash as well.
[profile.dev.package.sha2]
opt-level = 3
